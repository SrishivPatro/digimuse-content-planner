<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%2712%27 fill=%27%230048AC%27/%3E%3Ccircle cx=%2717.5%27 cy=%2722.5%27 r=%277%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273.6%27/%3E%3Crect x=%2723.2%27 y=%278%27 width=%273.6%27 height=%2721.5%27 rx=%271.8%27 fill=%27%23fff%27/%3E%3Ccircle cx=%279%27 cy=%2710%27 r=%272.6%27 fill=%27%23FF5A5F%27/%3E%3Ccircle cx=%2716%27 cy=%2710%27 r=%272.6%27 fill=%27%23FFA41B%27/%3E%3C/svg%3E">
<title>Digimuse Content Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,700;1,6..96,600&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
html{color-scheme:light}
html{color-scheme:light}
:root{
  --bg:#F5F7FC; --surface:#FFFFFF; --surface-2:#F7F8FC; --ink:#131A33; --ink-2:#444C66; --muted:#7A8199;
  --line:#E6E9F2; --line-2:#D3D8E6;
  --side:#FFFFFF; --side-2:#F1F4FB; --side-ink:#131A33; --side-muted:#6B7290;
  --accent:#0048AC; --accent-ink:#FFFFFF; --accent-soft:#E8EFFA; --navy:#0A0A0B;
  --c1:#0048AC; --c2:#FF5A5F; --c3:#FFA41B; --c4:#10B9A0; --c5:#7C5CFF; --c6:#1FA2FF;
  --c1s:#E8EFFA; --c2s:#FFEEEF; --c3s:#FFF4E4; --c4s:#E4F7F3; --c5s:#F1EEFF; --c6s:#E6F5FF;
  --s-idea:#8B91A7; --s-copy:#0048AC; --s-design:#7C5CFF; --s-client:#E08600; --s-changes:#E5484D; --s-approved:#12A26B; --s-live:#0E9AA7;
  --warn:#E5484D; --bar:#0048AC;
  --shadow:0 1px 2px rgba(19,26,51,.05),0 10px 28px rgba(19,26,51,.07);
  --fd:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --fb:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.015em;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:30px;line-height:1.1;font-weight:800}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--fm);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12.5px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:4px}
.spectrum{display:flex;height:5px;border-radius:99px;overflow:hidden}
.spectrum i{flex:1}
.spectrum i:nth-child(1){background:#FFFFFF} .spectrum i:nth-child(2){background:var(--c4)} .spectrum i:nth-child(3){background:var(--c3)} .spectrum i:nth-child(4){background:var(--c1)} .spectrum i:nth-child(5){background:var(--c5)} .spectrum i:nth-child(6){background:var(--c6)}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:20px}
.logo{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.logo .wm{font-family:var(--fd);font-weight:800;font-size:25px;letter-spacing:-.03em;line-height:1}
.logo .wm span{color:var(--c3)}
.logo small{color:var(--side-muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.bitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--side-muted);font-weight:600}
.nav button:hover,.bitem:hover{background:var(--side-2);color:var(--side-ink)}
.nav button.on,.bitem.on{background:var(--side-2);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--c3)}
.nav .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.nav .count{margin-left:auto;font-family:var(--fm);font-size:11px;background:var(--c1);color:#fff;border-radius:99px;padding:0 7px;font-weight:600}
.slabel{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);font-weight:700;padding:0 10px 6px}
.lnk{background:none;border:0;color:var(--c3);cursor:pointer;font-weight:700;font-size:12px;padding:2px 4px;text-transform:none;letter-spacing:0}
.blist{display:flex;flex-direction:column;gap:1px}
.bav{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:11px;flex:none;color:#fff}
.me{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--side-2);border-radius:12px}
.me label{font-size:11px;color:var(--side-muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.me select{background:var(--side);color:var(--side-ink);border-color:var(--side-2)}
.mode{font-size:12px;color:var(--side-muted);padding:8px 10px;border:1px dashed var(--side-2);border-radius:9px;margin:0 4px}
main{padding:28px 32px 90px;min-width:0}
.wrap{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* headers */
.hero{position:relative;border-radius:18px;padding:24px 26px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}
.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--c2),var(--c5),var(--c1),var(--c6),var(--c4))}
.hero.brand::before{background:var(--bc,var(--c1));height:100%;width:8px;inset:0 auto 0 0}
.hero .blob{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--bc,var(--c1));opacity:.09;pointer-events:none}
.hero > div{position:relative}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.crumb button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:600}
.crumb button:hover{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
label.chip{cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;background:var(--chc,#555);white-space:nowrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.hot{background:var(--c2);border-color:var(--c2);color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn .spark{opacity:.85}
.in{font-weight:400;width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
textarea.in{resize:vertical;line-height:1.5}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2);min-width:0}
label.f .hint{font-weight:400;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.fg .span2{grid-column:span 2}
@media (max-width:560px){.fg .span2{grid-column:auto}}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel > header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel > header p{color:var(--muted);font-size:13px;margin-top:2px}
.panel h2 .dotc{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:1px;background:var(--dc,var(--c1))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{border-radius:16px;padding:16px 18px;background:var(--sb,var(--c1s));border:1px solid color-mix(in srgb,var(--sc,var(--c1)) 20%,transparent);display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--fd);font-size:34px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.stat i{width:28px;height:6px;border-radius:99px;background:var(--sc,var(--c1));margin-bottom:6px}
.stat.warn b{color:var(--warn)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:700;color:var(--ink-2);background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.tw td .in{padding:5px 8px;font-size:13px}

.pill{--c:var(--s-idea);display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.flag{font-size:11.5px;color:var(--warn);font-weight:700}
.bar{display:flex;gap:2px;height:9px;border-radius:99px;overflow:hidden;background:var(--surface-2);min-width:130px}
.bar i{display:block;height:100%}
.meter{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--c5),var(--c1),var(--c6))}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%}
.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-radius:9px;white-space:nowrap;font-size:13px}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button.on{color:var(--accent-ink);background:var(--accent)}
.tabs .n{font-family:var(--fm);font-size:11px;opacity:.75;margin-left:4px}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:14px 16px}
.banner.run{border-color:var(--accent);background:var(--accent-soft)}
.banner.err{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.banner .grow{flex:1;min-width:220px;display:flex;flex-direction:column;gap:7px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* deck */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;display:flex;flex-direction:column;cursor:pointer;text-align:left;min-width:0;overflow:hidden;transition:transform .15s,box-shadow .15s}
.post:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.post{transition:none}.post:hover{transform:none}}
.post .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pmeta{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.post .cap{color:var(--ink-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.pfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:auto;flex-wrap:wrap;align-items:center}
.pil{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.pil::before{content:'';width:8px;height:8px;border-radius:3px;background:var(--pc,var(--c1))}
.unwritten .cv{opacity:.55}

/* creative preview */
.cv{--cbg:var(--c1);--cfg:#fff;--cac:var(--c4);background:var(--cbg);color:var(--cfg);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:16px}
.cv.band{min-height:160px;padding-top:38px}
.cv .deco{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--cac);opacity:.9}
.cv .deco2{position:absolute;right:40px;top:26px;width:34px;height:34px;border-radius:9px;border:3px solid var(--cfg);opacity:.35;transform:rotate(18deg)}
.cv .hl{font-family:var(--fd);font-weight:800;font-size:21px;line-height:1.05;letter-spacing:-.02em;position:relative;max-width:88%;text-wrap:balance}
.cv .sl{font-size:12px;opacity:.88;position:relative;max-width:90%}
.cv .ct{align-self:flex-start;background:var(--cac);color:var(--cbg);font-weight:800;font-size:11.5px;border-radius:99px;padding:3px 11px;position:relative}
.cv .fm{position:absolute;left:14px;top:12px;font-family:var(--fm);font-size:10.5px;opacity:.8;letter-spacing:.04em}
.phone{width:min(360px,100%);border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.phone .ph-h{display:flex;align-items:center;gap:9px;padding:10px 12px;font-weight:700;font-size:13px}
.phone .ph-h small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.phone .cv{aspect-ratio:4/5;padding:40px 24px 24px}
.phone .cv.tall{aspect-ratio:9/14}
.phone .cv.wide{aspect-ratio:16/9;padding:16px}
.phone .cv .hl{font-size:28px}
.phone .ph-c{padding:10px 12px 14px;font-size:13px;white-space:pre-wrap;display:flex;flex-direction:column;gap:6px}
.phone .ph-c .tags{color:var(--accent);font-size:12.5px}
.phone .ph-a{display:flex;gap:14px;padding:8px 12px 0;font-size:16px;color:var(--ink-2)}

/* calendar */
.calw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:900px}
.cal .hd{padding:9px 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);background:var(--surface-2)}
.cell{min-height:124px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;display:flex;flex-direction:column;gap:4px}
.cell:nth-child(7n+7){border-right:0}
.cell.off{background:var(--surface-2)}
.cell.we{background:color-mix(in srgb,var(--c4) 5%,var(--surface))}
.cell.today .dn span{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px}
.dn{font-family:var(--fm);font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;font-weight:500}
.dn button{visibility:hidden;background:var(--accent-soft);border:0;cursor:pointer;color:var(--accent);font-weight:800;font-size:14px;line-height:1;padding:2px 6px;border-radius:6px}
.cell:hover .dn button,.dn button:focus-visible{visibility:visible}
.tday{font-size:11px;font-weight:700;line-height:1.25;color:var(--ink);background:var(--c4s);border-radius:5px;padding:2px 6px}
.pc{--c:var(--s-idea);display:flex;gap:6px;width:100%;text-align:left;border:0;background:color-mix(in srgb,var(--chc,#666) 10%,var(--surface));border-radius:7px;padding:4px 6px;font-size:11.5px;line-height:1.3;cursor:grab;color:var(--ink);box-shadow:inset 3px 0 0 var(--chc,#666)}
.pc:hover{background:color-mix(in srgb,var(--chc,#666) 18%,var(--surface))}
.pc b{font-family:var(--fm);font-size:10px;font-weight:600;color:var(--ink-2);flex:none}
.pc i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;margin-top:4px;margin-left:auto}
.drop-on{background:var(--accent-soft)!important;outline:2px dashed var(--accent);outline-offset:-2px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;border-top:4px solid var(--c)}
.col > header{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;padding:2px 2px 4px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;text-align:left}
.kc:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kc b{font-size:13px;line-height:1.3}
.kc .row{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center}

/* drawer */
#drawer{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}
#drawer .scrim{position:absolute;inset:0;background:rgba(15,8,32,.45)}
.dw{position:relative;width:min(1000px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.dw-h{padding:calc(14px + env(safe-area-inset-top,0px)) 22px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative}
.dw-h::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--chc,var(--c1))}
.dw-h .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dw-b{flex:1;overflow:auto;padding:18px 22px calc(40px + env(safe-area-inset-bottom,0px))}
.dw-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.dw-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.dw-side{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.dw-grid{grid-template-columns:1fr}.dw-side{position:static;order:-1;align-items:center}}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;gap:11px}
.sec > h3{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec > h3 small{font-family:var(--fb);font-weight:500;font-size:12px;color:var(--muted)}
.sec.ai{background:linear-gradient(135deg,var(--c1s),var(--c2s));border-color:color-mix(in srgb,var(--c1) 25%,transparent)}
.hooks{display:flex;flex-direction:column;gap:5px}
.hooks button{text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13px}
.hooks button:hover{border-color:var(--accent)}
.hooks button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.aitools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.var{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;white-space:pre-wrap;font-size:13px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:2px 8px 2px 3px;background:var(--surface)}
.sw i{width:18px;height:18px;border-radius:5px;border:1px solid var(--line)}
.built{display:flex;flex-wrap:wrap;gap:6px}
.built span{font-size:12px;background:var(--c5s);color:var(--ink);border-radius:7px;padding:3px 9px;font-weight:500}
.cmt{border-left:3px solid var(--line-2);padding:4px 0 4px 11px;display:flex;flex-direction:column;gap:3px}
.cmt.client{border-left-color:var(--accent)}
.cmt .who{font-size:12px;color:var(--muted)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.dl dt{color:var(--muted)} .dl dd{margin:0}
.late{color:var(--warn);font-weight:700}
.rowline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.rowline > *{flex:1;min-width:140px}
.rowline > .btn{flex:none}
.list{display:flex;flex-direction:column;gap:7px}
.li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--surface)}
.li .tx{min-width:0;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 7px;white-space:nowrap}
.tag.fb{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.empty{border:2px dashed var(--line-2);border-radius:16px;padding:32px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--ink-2);background:var(--surface)}
.answer{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;white-space:pre-wrap;font-size:13px}
.ring{display:flex;align-items:center;gap:14px}
.ring b{font-family:var(--fd);font-size:40px;line-height:1;font-weight:800}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:9px;align-items:center;font-size:13px;cursor:pointer;padding:6px 9px;border-radius:8px;background:var(--surface-2)}
.checks label.done{color:var(--muted);text-decoration:line-through}
.checks input{accent-color:var(--s-approved);width:16px;height:16px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}

/* review */
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.rvc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.rvc .phone{box-shadow:none}
.rvc .acts{width:100%;justify-content:center}

/* charts */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,200px) 1fr 58px;gap:10px;align-items:center;font-size:12.5px}
.hb .lb{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:14px;position:relative}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.hb .tr:hover i{filter:brightness(1.12)}
.hb .v{font-family:var(--fm);font-size:12px;color:var(--ink);text-align:right}
.hb.top .v{font-weight:700}
.grid-x{position:relative}
#tip{position:fixed;z-index:70;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;pointer-events:none;max-width:260px;box-shadow:var(--shadow)}
.report{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}

#login{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--side);padding:16px}
#login .box{background:var(--surface);border-radius:20px;padding:30px 28px;width:min(400px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#login .wm{font-family:var(--fd);font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1}
#login .wm span{color:var(--accent)}
#login .err{color:var(--warn);font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:11px;font-weight:700;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(15,8,32,.45);padding:16px}
#modal .box{background:var(--surface);border-radius:18px;padding:22px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
#copybox{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(15,8,32,.45);padding:16px}
#copybox .box{background:var(--surface);border-radius:14px;padding:18px;width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.range{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.range input{flex:1;accent-color:var(--accent)}
.sp{flex:1}
.idea{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--surface);border-left:4px solid var(--pc,var(--c3))}
.idea .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.idea.used{opacity:.55}
.lineup{display:flex;flex-direction:column;gap:8px}
.lu{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface);cursor:pointer;text-align:left}
.lu:hover{border-color:var(--line-2)}
.lu .d{font-family:var(--fd);font-weight:800;font-size:20px;line-height:1;text-align:center}
.lu .d small{display:block;font-family:var(--fb);font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:16px;gap:12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
  .blist{flex-direction:row;flex-wrap:wrap;gap:4px}
  .bitem{width:auto}
  .me{margin-top:0;flex-direction:row;align-items:center}
  .me select{max-width:220px}
  main{padding:18px 16px 90px}
  h1{font-size:25px}
  .hero{padding:20px 18px}
  .rv{grid-template-columns:1fr}
}
/* ===== colourful white-base layer ===== */
body{font-size:13.5px}
h1{font-weight:700;letter-spacing:-.01em;font-size:34px}
h2{font-weight:700;letter-spacing:0}
.stat b,.lu .d,.ring b,.cv .hl,.slide h2,.slide .card .big,.slide .pcv .hl,#login .wm,.logo .wm,.post b{font-family:var(--fb)}
.logo img{height:46px;width:auto;display:block;margin-left:-4px}
#login .box img{height:44px;width:auto}
h3{font-family:var(--fb)}
h2{font-weight:700;font-size:18px;letter-spacing:-.01em}
h3{font-weight:700;font-size:14px}
.side{border-right:1px solid var(--line);gap:22px}
.logo{flex-direction:row;align-items:center;gap:11px;padding:2px 6px}
.logo svg{width:40px;height:40px;flex:none}
.logo .wm{font-family:var(--fd);font-weight:800;font-size:21px;letter-spacing:-.03em;line-height:1;color:var(--navy)}
.logo .wm span{color:var(--c2)}
.logo small{display:block;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.nav button,.bitem{border-radius:10px;font-weight:600;color:var(--ink-2);padding:8px 10px}
.nav button:hover,.bitem:hover{background:var(--side-2);color:var(--ink)}
.nav button.on,.bitem.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.nav .ico{width:30px;height:30px;border-radius:9px;background:var(--ics);color:var(--ic)}
.nav .ico svg{width:16px;height:16px}
.nav .count{background:var(--c2);color:#fff}
.slabel{color:var(--muted)}
.lnk{color:var(--accent)}
.bav{border-radius:8px;font-family:var(--fd);font-weight:700}
.me{background:var(--side-2);border:0}
.me label{color:var(--muted)}
.me select{background:#fff;color:var(--ink);border-color:var(--line-2)}
.mode{border-color:var(--line-2);color:var(--muted)}
.hero{border-radius:20px;padding:28px 30px;border:1px solid var(--line)}
.hero::before{display:none}
.hero::after{content:'';position:absolute;right:-80px;top:-120px;width:380px;height:320px;background:radial-gradient(circle at 30% 60%,color-mix(in srgb,var(--c3) 38%,transparent),transparent 55%),radial-gradient(circle at 65% 35%,color-mix(in srgb,var(--c2) 30%,transparent),transparent 55%),radial-gradient(circle at 55% 75%,color-mix(in srgb,var(--c1) 30%,transparent),transparent 60%);pointer-events:none;opacity:.8}
.hero.brand::after{background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--bc) 30%,transparent),transparent 60%)}
.hero.brand::before{display:block;width:6px;height:auto;inset:18px auto 18px 0;border-radius:0 6px 6px 0;background:var(--bc)}
.hero .blob{display:none}
.hero > div,.hero .acts{position:relative;z-index:1}
.panel{border-radius:18px}
.panel h2 .dotc{width:10px;height:10px;border-radius:4px}
.stat{border-radius:18px;border:0;background:var(--sb);padding:18px 20px;flex-direction:row;align-items:center;gap:14px}
.stat .si{width:44px;height:44px;border-radius:13px;background:var(--sc);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 16px color-mix(in srgb,var(--sc) 35%,transparent)}
.stat .si svg{width:21px;height:21px}
.stat i{display:none}
.stat b{font-size:30px;font-weight:800}
.stat span{font-weight:600;color:var(--ink-2);font-size:12px}
.stat.warn b{color:var(--warn)}
.btn{border-radius:10px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.hot{background:var(--c2);border-color:var(--c2);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c2) 28%,transparent)}
.tabs{background:var(--surface);border-radius:14px}
.tabs button{border-radius:10px}
.tabs button.on{background:var(--accent);color:#fff}
th{background:var(--surface-2)}
.post{border-radius:16px}
.cv .hl{font-weight:800}
.chip{background:var(--surface)}
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.step{border-radius:18px;padding:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.step .n{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--sc)}
.step p{color:var(--ink-2);font-size:13px}
.step .btn{align-self:flex-start;margin-top:auto}
/* deck */
.deckwrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:960px){.deckwrap{grid-template-columns:1fr}}
.deckside{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.secs{display:flex;flex-direction:column;gap:4px}
.secs label{display:flex;gap:9px;align-items:center;padding:6px 9px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
.secs label:hover{background:var(--surface-2)}
.secs input{accent-color:var(--accent);width:15px;height:15px}
.slides{display:flex;flex-direction:column;gap:18px}
.sl-wrap{display:flex;flex-direction:column;gap:6px}
.sl-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.slide{--sc1:var(--accent);aspect-ratio:16/9;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;container-type:inline-size;color:#131A33;font-family:var(--fb);box-shadow:var(--shadow)}
.slide .sbar{position:absolute;left:0;top:0;right:0;height:1.1cqw;background:linear-gradient(90deg,var(--sc1),var(--c2),var(--c3));border:0;border-radius:0;min-width:0}
.slide .sbody{position:absolute;inset:4.4cqw 5cqw 5.4cqw 5cqw;display:flex;flex-direction:column;gap:2cqw;border:0;padding:0;background:none;border-radius:0}
.slide .ey{font-size:1.25cqw;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sc1)}
.slide h2{font-size:3.3cqw;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0;color:#131A33}
.slide .ft{position:absolute;left:5cqw;right:5cqw;bottom:2cqw;display:flex;justify-content:space-between;font-size:1.05cqw;color:#8B91A7;font-weight:600}
.slide table{font-size:1.25cqw;width:100%;border-collapse:collapse}
.slide th{font-size:1.05cqw;background:#F3F5FB;color:#444C66;padding:.8cqw 1cqw;letter-spacing:.06em;text-transform:uppercase;white-space:normal}
.slide td{padding:.8cqw 1cqw;border-bottom:1px solid #E6E9F2;color:#252C45;vertical-align:top}
.slide .kv{display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:1.6cqw}
.slide .kv div{background:#F7F8FC;border-radius:1.2cqw;padding:1.6cqw;border-top:.4cqw solid var(--kc,var(--sc1))}
.slide .kv b{display:block;font-size:1.15cqw;letter-spacing:.1em;text-transform:uppercase;color:var(--kc,var(--sc1));margin-bottom:.6cqw}
.slide .kv p{font-size:1.5cqw;line-height:1.4;color:#252C45}
.slide .cards{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:1.4cqw;flex:1;min-height:0}
.slide .card{border-radius:1.4cqw;padding:1.6cqw;background:color-mix(in srgb,var(--kc) 10%,#fff);border:1px solid color-mix(in srgb,var(--kc) 25%,#fff);display:flex;flex-direction:column;gap:.8cqw;overflow:hidden}
.slide .card .big{font-size:3.4cqw;font-weight:800;color:var(--kc);line-height:1}
.slide .card h4{font-size:1.6cqw;font-weight:800;margin:0}
.slide .card p{font-size:1.2cqw;line-height:1.4;color:#444C66}
.slide.cover{background:var(--navy);color:#fff}
.slide.cover .sbody{justify-content:center;gap:1.6cqw}
.slide.cover h2{color:#fff;font-size:5.4cqw}
.slide.cover .sub{font-size:2cqw;font-weight:600;color:#C9D3F5}
.slide.cover .theme{font-size:2.4cqw;font-weight:700;font-style:italic;color:var(--c3)}
.slide.cover .ft{color:#8FA0D6}
.slide.cover .dots{position:absolute;right:6cqw;top:8cqw;display:flex;gap:1.2cqw}
.slide.cover .dots i{width:3cqw;height:3cqw;border-radius:50%}
.slide .pgrid{display:grid;grid-template-columns:34cqw 1fr;gap:3cqw;flex:1;min-height:0}
.slide .pcv{border-radius:1.4cqw;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:2.4cqw;gap:1cqw;position:relative}
.slide .pcv .hl{font-size:3cqw;font-weight:800;line-height:1.05}
.slide .pcv .sl{font-size:1.4cqw;opacity:.9}
.slide .pcv .ct{align-self:flex-start;font-size:1.2cqw;font-weight:800;border-radius:99px;padding:.4cqw 1.2cqw}
.slide .pcv .o{position:absolute;right:-5cqw;top:-5cqw;width:16cqw;height:16cqw;border-radius:50%;opacity:.9}
.slide .pmeta2{display:flex;gap:1cqw;flex-wrap:wrap;font-size:1.2cqw;font-weight:700}
.slide .pmeta2 span{padding:.3cqw 1cqw;border-radius:99px;background:#F1F3FA;color:#444C66}
.slide .pmeta2 span.ch{color:#fff}
.slide .hook{font-size:1.9cqw;font-weight:800;line-height:1.25}
.slide .capt{font-size:1.3cqw;line-height:1.5;white-space:pre-wrap;color:#333A52;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:9}
.slide .tags{font-size:1.2cqw;color:var(--sc1);font-weight:600}
.slide .mini{font-size:1.1cqw}
.slide .mini td{padding:.5cqw .8cqw}
.slide .calg{display:grid;grid-template-columns:repeat(7,1fr);gap:.5cqw;flex:1;min-height:0}
.slide .calg div{background:#F7F8FC;border-radius:.6cqw;padding:.5cqw .6cqw;font-size:.95cqw;overflow:hidden;display:flex;flex-direction:column;gap:.3cqw}
.slide .calg .h{background:none;font-weight:700;color:#8B91A7;text-transform:uppercase;letter-spacing:.08em;padding:0 .6cqw}
.slide .calg .x{background:none}
.slide .calg b{font-size:1cqw}
.slide .calg i{font-style:normal;border-radius:.4cqw;padding:.15cqw .4cqw;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slide ul{margin:0;padding-left:2.2cqw;font-size:1.6cqw;line-height:1.55;display:flex;flex-direction:column;gap:.6cqw}
#present{position:fixed;inset:0;z-index:95;background:#070B1A;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#present .slide{width:min(100%,calc((100vh - 110px) * 16 / 9));border:0;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
#present .pbar{display:flex;gap:10px;align-items:center;margin-top:16px;color:#C9D3F5;font-weight:600}
#present .pbar .btn{background:#1A2342;border-color:#2A3560;color:#fff}
#printdeck{display:none}
.ms{position:relative;min-width:0}
.ms summary{list-style:none;cursor:pointer;border:1px solid var(--line-2);border-radius:9px;padding:7px 30px 7px 11px;background:var(--surface);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.ms summary::-webkit-details-marker{display:none}
.ms summary::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.ms[open] summary{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ms summary.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ms-pop{position:absolute;z-index:25;top:calc(100% + 4px);right:0;min-width:260px;max-width:340px;max-height:280px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.ms-pop label{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer}
.ms-pop label:hover{background:var(--surface-2)}
.ms-pop input{accent-color:var(--accent);width:15px;height:15px;flex:none}
.ms-pop .ms-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;padding:6px 8px 2px}
.tw.vis{overflow:visible}
.modes{display:inline-flex;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.modes label{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink-2)}
.modes input{accent-color:var(--accent)}
.modes label:has(input:checked){background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.week{display:grid;grid-template-columns:repeat(7,minmax(138px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.dayc{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;min-width:138px}
.dayc > header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.slot{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--chc,var(--accent));border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px}
.slot select,.slot input{font-size:12px;padding:5px 7px;border-radius:7px}
.slot .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.slot .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:2px 4px}
.slot .x:hover{color:var(--warn)}
[draggable="true"].dragging{opacity:.45}
.post.drop-on,.pc.drop-on,.sl-wrap.drop-on{outline:3px dashed var(--accent);outline-offset:3px}
@media (max-width:760px){.tw.vis{overflow-x:auto}}
.mxcell{display:flex;flex-direction:column;gap:6px;min-width:200px}
@media print{
  @page{size:13.333in 7.5in;margin:0}
  body *{visibility:hidden}
  #printdeck,#printdeck *{visibility:visible}
  #printdeck{display:block;position:absolute;left:0;top:0;width:13.333in}
  #printdeck .slide{width:13.333in;border:0;border-radius:0;box-shadow:none;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

const qq = {};
function queue(key, fn){ const p = (qq[key] || Promise.resolve()).then(fn, fn); qq[key] = p.catch(() => {}); return p; }
function dbErr(e){ const m = {quota_exceeded:'Storage is full. Delete old plans to make room.', invalid_argument:'You do not have edit access to this planner.', revoked:'Access to shared data was removed.'}; toast(m[e?.code] || 'Could not save. Try again.'); }
async function put(col, id, obj){ D[col][id] = obj; sched(); if (DB) return queue(col+'/'+id, () => DB.doc(col+'/'+id).set(obj)).catch(dbErr); }
async function patch(col, id, part){ const cur = D[col][id]; if (!cur) return; D[col][id] = merge(clone(cur), part); sched(); if (DB) return queue(col+'/'+id, () => DB.doc(col+'/'+id).update(part)).catch(dbErr); }
async function del(col, id){ delete D[col][id]; sched(); if (DB) return queue(col+'/'+id, () => DB.doc(col+'/'+id).delete()).catch(dbErr); }

/* ---------- AI ---------- */
async function ai(prompt, {tier='default', json=true, signal}={}){
  if (!S) throw {code:'not_granted', message:'AI unavailable'};
  const o = {modelTier:tier, cache:false}; if (signal) o.signal = signal;
  if (json) return await S.json(prompt, o);
  return (await S(prompt, o)).text;
}

Rules:

const FMT_CH = {Static:['Instagram','Facebook','LinkedIn','X','Threads','Pinterest','WhatsApp'], Carousel:['Instagram','LinkedIn','Facebook'], Reel:['Instagram','Facebook','YouTube'], Story:['Instagram','Facebook','WhatsApp'], Video:['YouTube','LinkedIn','Facebook','X'], Text:['LinkedIn','X','Threads']};

function fmtChoices(b, f){ const act = activeCh(b); const l = FMT_CH[f].filter(c => act.includes(c)); return l.length ? l : FMT_CH[f].filter(c => act.length ? false : true); }
function defaultMix(b){
  if (b.mixDefault) return b.mixDefault;
  const wk = activeCh(b).reduce((s, c) => s + (+b.channels[c].perWeek || 0), 0);
  const total = Math.min(60, Math.max(4, Math.round(wk * 4.3)));
  const pct = {Reel:.35, Carousel:.25, Static:.3, Story:.1, Video:0, Text:0};
  if (activeCh(b).includes('LinkedIn')){ pct.Text = .1; pct.Static = .2; }
  const m = {}; FORMATS.forEach(f => { const ch = fmtChoices(b, f); m[f] = {n: ch.length ? Math.round(total * pct[f]) : 0, ch}; });
  return m;
}
function msText(kind, sel){ if (!sel.length) return kind === 'product' ? 'Any product (AI decides)' : 'Any pillar (AI decides)'; if (sel.length === 1) return sel[0] === '__brand' ? 'Brand-level, no product' : sel[0]; return `${sel.length} ${kind}s`; }
function multiSel(id, kind, options, selected){

function owner(p){ const g = group(p.status); if (g === 'copy') return p.writer; if (g === 'design') return p.designer; if (g === 'client') return p.am || D.brands[p.brandId]?.team?.am; return ''; }
function isLate(p){ const d = curDue(p); return !!d && d < today(); }
function pillarColor(plan, name){ const i = arr(plan?.strategy?.pillars).findIndex(x => x.name === name); return `var(${PAL[(i < 0 ? 5 : i) % PAL.length]})`; }
function sizeFor(ch, f){
  if (f === 'Text') return 'No creative needed (text post)';
  if (f === 'Reel' || f === 'Story') return '1080 × 1920 (9:16)';
  if (ch === 'YouTube') return f === 'Video' ? '1920 × 1080 (16:9) + thumbnail 1280 × 720' : '1080 × 1920 (9:16)';
  if (ch === 'X') return '1600 × 900 (16:9)';
  if (ch === 'Pinterest') return '1000 × 1500 (2:3)';
  if (ch === 'WhatsApp') return '1080 × 1080 (1:1)';
  if (ch === 'LinkedIn' && f === 'Carousel') return '1080 × 1350 PDF carousel';
  if (f === 'Video') return '1080 × 1350 (4:5) or 1080 × 1920';
  return '1080 × 1350 (4:5)';
}
function flags(p){
  const f = []; if (!p.hasContent) return f;
  const b = D.brands[p.brandId]; if (!b) return f;
  const txt = [p.caption, p.onImage?.headline, p.onImage?.subline, p.onImage?.cta, p.hook].map(str).join(' ').toLowerCase();
  arr(b.brain?.rules).filter(r => r.type === 'Banned word').flatMap(r => str(r.text).split(/[,;\n]/)).map(s => s.trim().toLowerCase()).filter(Boolean).forEach(w => { if (new RegExp('(^|[^a-z])' + escRe(w) + '([^a-z]|$)').test(txt)) f.push(`Uses banned word "${w}"`); });
  const disc = arr(b.brain?.rules).filter(r => r.type === 'Disclaimer');
  if (disc.length && !str(p.compliance).trim() && !disc.some(r => txt.includes(str(r.text).toLowerCase().slice(0, 24)))) f.push('Disclaimer missing');
  if (str(p.onImage?.headline).split(/\s+/).filter(Boolean).length > 9) f.push('Headline over 8 words');
  if (p.channel === 'X' && str(p.caption).length > 280) f.push('Over 280 characters for X');
  return f;
}
function health(b){
  const br = b.brain || {};
  const items = [
    ['Products or services added', arr(br.products).length > 0, 20],
    ['At least 3 brand rules', arr(br.rules).length >= 3, 15],
    ['At least 2 saved references', arr(br.refs).length >= 2, 15],
    ['Past winning posts pasted', str(br.pastPosts).trim().length > 40, 15],
    ['Brand colours set', kitColors(b).length > 0, 10],
    ['Voice adjectives set', !!str(b.voice?.adjectives).trim(), 10],
    ["This month's campaign brief", str(br.brief).trim().length > 10, 10],
    ['Competitors listed', !!str(b.competitors).trim(), 5]
  ];
  return {score: items.reduce((s,i) => s + (i[1] ? i[2] : 0), 0), items};
}
function er(p){ const m = p.metrics || {}; const r = num(m.reach) || num(m.impressions); if (!r) return null; return (num(m.likes) + num(m.comments) + num(m.saves) + num(m.shares)) / r * 100; }
function hasMetrics(p){ const m = p.metrics || {}; return METRICS.some(([k]) => num(m[k]) > 0); }

let rq = false, pendingR = false;
function isEditing(){ const a = document.activeElement; if (!a || !a.closest || !a.closest('#main,#drawer')) return false; return a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !['checkbox','radio','button','range','month','date','file'].includes(a.type)); }
function sched(){ if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; if (isEditing()){ pendingR = true; return; } renderAll(); }); }
document.addEventListener('focusout', () => { if (pendingR) setTimeout(() => { if (!isEditing() && pendingR){ pendingR = false; renderAll(); } }, 30); });
function renderAll(){

}
let tT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2800); }
function copyText(txt){
  let p;
  try { p = navigator.clipboard.writeText(txt); } catch (e) { p = Promise.reject(e); }
  p.then(() => toast('Copied'), () => {
    const box = $('#copybox'); box.hidden = false;
    box.innerHTML = `<div class="box"><h3>Copy this text</h3><p class="muted sm">Your browser blocked automatic copying. The text is selected; press Ctrl+C or ⌘C.</p><textarea class="in" id="cbx" rows="12">${esc(txt)}</textarea><div class="acts"><button class="btn" data-act="closeCopy">Done</button></div></div>`;
    const ta = $('#cbx'); ta.focus(); ta.select();

}
const stPill = s => `<span class="pill" style="--c:var(${STC[s] || '--s-idea'})">${esc(s)}</span>`;
function tbl(head, rows, cls=''){ return `<div class="tw"><table class="${cls}"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${head.length}" class="muted">Nothing here yet.</td></tr>`}</tbody></table></div>`; }
function progressBar(ps){

function reportStats(planId){

  const grp = key => { const g = {}; withM.forEach(p => { const e = er(p); if (e == null) return; (g[p[key] || '—'] = g[p[key] || '—'] || []).push(e); }); return Object.entries(g).map(([l, v]) => ({l, v:+(v.reduce((a, b) => a + b, 0) / v.length).toFixed(2), n:v.length})).sort((a, b) => b.v - a.v); };
  const top = withM.filter(p => er(p) != null).sort((a, b) => er(b) - er(a)).slice(0, 5).map(p => ({id:p.id, date:p.date, channel:p.channel, format:p.format, pillar:p.pillar, topic:p.topic, hook:p.hook, er:+er(p).toFixed(2), reach:num(p.metrics.reach), url:p.liveUrl || ''}));
  return {planned:ps.length, published:ps.filter(p => p.status === 'Published').length, approved:ps.filter(p => group(p.status) === 'done').length, measured:withM.length, reach, impressions:sum('impressions'), engagements:eng, er:reach ? +(eng / reach * 100).toFixed(2) : 0, saves:sum('saves'), shares:sum('shares'), clicks:sum('clicks'), views:sum('views'), byPillar:grp('pillar'), byFormat:grp('format'), byChannel:grp('channel'), top};
}

function vPlan(){
  const plan = D.plans[ui.planId];
  if (!plan) return `<div class="empty"><p>This plan was removed.</p><button class="btn" data-act="go" data-v="home">Back to dashboard</button></div>`;
  const b = D.brands[plan.brandId] || {name:'Brand'};
  const ps = postsOf(ui.planId);
  const c = brandColors(b);
  const rvN = ps.filter(p => p.status === 'Sent to client').length;
  const tabs = [['present','Client deck'],['deck','Posts'],['calendar','Calendar'],['board','Board'],['research','Research'],['strategy','Strategy'],['topical','Topical days'],['review','Client review',rvN],['report','Performance'],['export','Export']];
  let body = '';
  switch (ui.tab){
    case 'present': body = vPresent(plan, ps); break;
    case 'calendar': body = vCal(plan, ps); break;
    case 'board': body = vBoard(ps); break;
    case 'review': body = vReview(plan, ps); break;
    case 'report': body = vReport(plan, ps); break;

      } else if (m.k === 'kv'){

        m.items.forEach(([l, t, c], j) => { const x = X + (j % cols) * (w + gap), y = 1.6 + Math.floor(j / cols) * (h + gap); const col = PALHEX[c] || ACC;
          sl.addShape(pptx.ShapeType.rect, {x, y, w, h, fill:{color:'F7F8FC'}, line:{color:'F7F8FC'}}); sl.addShape(pptx.ShapeType.rect, {x, y, w, h:0.07, fill:{color:col}, line:{color:col}});
          sl.addText([{text:str(l).toUpperCase(), options:{bold:true, fontSize:10, color:col, charSpacing:2, breakLine:true}}, {text:str(t), options:{fontSize:cols === 1 ? 24 : 16, color:'252C45'}}], {x:x + 0.2, y:y + 0.2, w:w - 0.4, h:h - 0.3, fontFace:F, valign:'top', paraSpaceAfter:6}); });
      } else if (m.k === 'cards'){
        const cols = m.cols, gap = 0.25, w = (CW - gap * (cols - 1)) / cols, h = m.cards.some(c => c.body) ? 4.9 : 2.3;
        m.cards.forEach((c, j) => { const x = X + j * (w + gap), col = PALHEX[c.color] || ACC;
          sl.addShape(pptx.ShapeType.roundRect, {x, y:1.65, w, h, fill:{color:tint(col, .88)}, line:{color:tint(col, .7)}, rectRadius:0.12});
          const parts = []; if (c.big) parts.push({text:str(c.big), options:{bold:true, fontSize:30, color:col, breakLine:true}}); parts.push({text:str(c.title), options:{bold:true, fontSize:cols > 4 ? 15 : 18, color:INK, breakLine:true}}); if (c.body) parts.push({text:str(c.body), options:{fontSize:cols > 4 ? 12 : 14, color:'444C66'}});
          sl.addText(parts, {x:x + 0.2, y:1.85, w:w - 0.4, h:h - 0.4, fontFace:F, valign:'top', paraSpaceAfter:8}); });
      } else if (m.k === 'list'){

      } else if (m.k === 'calendar'){

        sl.addTable(rows, {x:X, y:1.5, w:CW, fontFace:F, fontSize:7.5, color:'252C45', valign:'top', border:{type:'solid', pt:0.5, color:'E6E9F2'}, margin:0.05, rowH:[0.3].concat(Array(rows.length - 1).fill((5.3 - 0.3) / (rows.length - 1)))});

        sl.addText(cv, {x:X + 0.3, y:3.3, w:3.9, h:3.3, fontFace:F, valign:'bottom', paraSpaceAfter:6});

        const extra = arr(p.slides).length ? [['#','Slide copy']].concat(arr(p.slides).slice(0, 6).map((x, j) => [String(j + 1), str(x.copy)])) : arr(p.script).length ? [['Time','On screen','Voiceover']].concat(arr(p.script).slice(0, 5).map(x => [str(x.t), str(x.onscreen), str(x.vo)])) : null;
        sl.addText(str(p.caption) + (p.hashtags ? '\n\n' + p.hashtags : ''), {x:RX, y:2.75, w:RW, h:extra ? 1.95 : 3.35, fontFace:F, fontSize:extra ? 10.5 : 12.5, color:'333A52', valign:'top', fit:'shrink'});
        if (p.design?.layout || p.design?.mood) sl.addText([{text:'DESIGN REFERENCE  ', options:{bold:true, color:ACC, fontSize:8.5, charSpacing:1}}, {text:[p.design.layout, p.design.mood].filter(Boolean).join(' · ').slice(0, 220) + (p.design.refSearch ? '  |  Look up: ' + p.design.refSearch : ''), options:{color:'444C66', fontSize:9}}], {x:RX, y:extra ? 6.45 : 6.2, w:RW, h:0.5, fontFace:F, valign:'top', fit:'shrink'});

      }
    });
    const out = await pptx.write({outputType:'arraybuffer'});
    await save(meta.file || fname(plan, 'pptx'), out);
  } catch (e){ console.error(e); toast('Could not build the PowerPoint'); }
}

      await pool(slots.map((sl, i) => ({sl, r:list.find(x => +x?.i === i) || list[i] || {}})), 4, async ({sl, r}) => {
        const id = uid();
        const prod = sl.product === '__brand' ? '' : sl.product || (r.product && !/^(brand-level|choose)$/i.test(r.product) ? str(r.product) : '');
        await put('posts', id, newPost(b, pid, {id, date:sl.date, time:sl.time || str(r.time) || '19:00', channel:sl.channel, format:sl.format, pillar:sl.pillar || str(r.pillar), topic:str(r.topic) || `${sl.format} for ${sl.channel}`, hook:str(r.hook), topical:str(r.topical), objective:str(r.objective), product:prod, brandLevel:sl.product === '__brand' || (!prod && /brand-level/i.test(str(r.product)))}));
      });
    }
    if (!postsOf(pid).length){
      step(pid, 'Planning the content calendar…');
      const slots = await ai(promptC(b, plan), {signal});
      const list = (Array.isArray(slots) ? slots : arr(slots?.posts)).filter(s => s && validD(s.date));
      if (!list.length) throw {code:'invalid_json'};
      step(pid, `Adding ${list.length} posts to the calendar…`);
      const rr = {}; const used = {};
      const pick = (f, kind, want, pool0) => { if (!pool0.length) return want; const key = f + kind; used[key] = used[key] || {}; if (pool0.includes(want) && !used[key][want]){ used[key][want] = 1; return want; } const free = pool0.filter(x => !used[key][x]); const v = free.length ? free[0] : pool0[(rr[key] = ((rr[key] ?? -1) + 1)) % pool0.length]; used[key][v] = 1; return v; };
      list.forEach(s => { const f = FORMATS.includes(s.format) ? s.format : 'Static'; const m = plan.opts.mix?.[f]; const prods = fmtProducts(m); if (prods.length){ const v = pick(f, 'p', str(s.product) || '__brand', prods); s._product = v === '__brand' ? '' : v; s._brand = v === '__brand'; } else s._product = str(s.product); if (arr(m?.pillars).length) s.pillar = pick(f, 'l', str(s.pillar), m.pillars); });
      await pool(list, 4, async s => {
        const id = uid();
        await put('posts', id, newPost(b, pid, {id, date:s.date, time:str(s.time) || '19:00', format:FORMATS.includes(s.format) ? s.format : 'Static', product:s._product, brandLevel:!!s._brand, channel:(() => { const f = FORMATS.includes(s.format) ? s.format : 'Static'; const allow = plan.opts.mix?.[f]?.ch; return CH.includes(s.channel) && (!allow || !allow.length || allow.includes(s.channel)) ? s.channel : (allow && allow[0]) || activeCh(b)[0]; })(), pillar:str(s.pillar), topic:str(s.topic), hook:str(s.hook), topical:str(s.topical), objective:str(s.objective)}));
      });
    }
    const todo = postsOf(pid).filter(p => !p.hasContent);
    const batches = []; for (let i = 0; i < todo.length; i += 4) batches.push(todo.slice(i, i+4));
    gen[pid].total = todo.length; gen[pid].done = 0;
    step(pid, `Writing posts · 0 of ${todo.length} done`);
    let failed = 0;
    await pool(batches, 2, async bt => {
      if (signal.aborted) return;
      bt.forEach(p => busy[p.id] = 'Writing…'); sched();
      try { await writePosts(bt, '', signal); if (D.plans[pid]?.opts?.cd !== false){ step(pid, `Creative director reviewing posts · ${gen[pid].done} of ${gen[pid].total} done`); try { await cdReview(bt.map(p => p.id), signal); } catch (e){ if (e?.code === 'cancelled') throw e; } } }
      catch (e){ if (e?.code === 'cancelled') throw e; if (['not_granted','rate_limited','session_expired','sampling_disabled'].includes(e?.code)) throw e; failed += bt.length; }
      finally { bt.forEach(p => delete busy[p.id]); }
      gen[pid].done += bt.length; step(pid, `Writing posts · ${gen[pid].done} of ${gen[pid].total} done`);
    });
    if (failed) await patch('plans', pid, {status:'paused', error:`${failed} posts could not be written. Press Continue to retry them.`});
    else { await patch('plans', pid, {status:'ready', error:'', readyAt:Date.now()}); toast('Plan ready'); }
  } catch (e){
    await patch('plans', pid, {status:'paused', error:e?.code === 'cancelled' ? 'Stopped. Press Continue to pick up where it left off.' : errCopy(e)});
  } finally {
    gen[pid].running = false; sched();
  }
}

const TOOL = {
  punchier:'Make it punchier and more scroll-stopping: shorter sentences, stronger verbs, sharper first line.',
  shorter:'Cut the length by about 40% without losing the key message or CTA.',
  premium:'Make it sound more premium and refined: fewer emojis, confident and calm tone.',
  hinglish:'Rewrite in natural Hinglish (Hindi-English mix in Roman script), the way popular Indian creators write.',
  emoji:'Add a few well-placed, relevant emojis. Do not overdo it.',
  noemoji:'Remove every emoji and keep everything else.',
  ref:'Rewrite it to follow the structure and style of the saved Copy and Hook references in the brand brain, without copying them.',
  variants:'Write 3 distinct alternatives, each with a different angle.'
};
const FIELD_L = {'caption':'caption','hook':'opening hook','onImage.headline':'on-image headline (max 8 words)','onImage.subline':'on-image subline (max 14 words)','onImage.cta':'CTA (max 4 words)'};
async function aiTool(k){
  const p = D.posts[ui.postId]; if (!p) return;
  const field = $('#ai-field')?.value || 'caption'; lsSet('mp_aifield', field);
  const instr = k === 'custom' ? ($('#ai-custom')?.value || '').trim() : TOOL[k];
  if (!instr){ toast('Type an instruction first'); return; }
  const b = D.brands[p.brandId];
  const cur = str(getPath(p, field));
  const many = k === 'variants';
  const prompt = `${PRE}

${brandCtx(b, 7000)}

POST: ${p.channel} ${p.format} · pillar ${p.pillar} · topic: ${p.topic}
On-image: ${p.onImage?.headline} / ${p.onImage?.subline} / ${p.onImage?.cta}
Caption: ${str(p.caption).slice(0, 1500)}

TASK: Rewrite the ${FIELD_L[field]}. Instruction: ${instr}
Keep it true to the brand brain, keep the facts, respect banned words and disclaimers, and keep it fitting the ${p.channel} channel.

CURRENT ${FIELD_L[field].toUpperCase()}:
${cur || '(empty — write it fresh)'}

Reply with only JSON: ${many ? '{"options":["","",""]}' : '{"text":""}'}`;
  busy[p.id] = many ? 'Writing 3 variants…' : 'Rewriting…'; delete variants[p.id]; sched();
  try {
    const r = await ai(prompt, {tier: ['emoji','noemoji','shorter'].includes(k) ? 'quick' : 'default'});
    if (many){ const o = arr(r?.options).map(str).filter(Boolean); if (!o.length) throw {code:'invalid_json'}; variants[p.id] = {field, options:o}; }
    else { const t = str(r?.text); if (!t) throw {code:'invalid_json'}; undo[p.id] = {field, value:cur}; await setField(p.id, field, t); toast('Rewritten'); }
  } catch (e){ toast(errCopy(e)); }
  finally { delete busy[p.id]; sched(); }
}
async function setField(id, path, value){
  const p = D.posts[id]; if (!p) return;
  const c = clone(p); setPath(c, path, value);
  const top = path.split('.')[0];
  await patch('posts', id, {[top]: c[top]});
}

  createPlan: async () => {
    const month = $('#npl-month')?.value;
    if (!/^\d{4}-\d{2}$/.test(month || '')){ toast('Pick a month'); return; }
    const id = `${ui.brandId}__${month}`;
    if (D.plans[id]){ ui.view = 'plan'; ui.planId = id; ui.tab = 'deck'; renderAll(); window.scrollTo(0,0); if (D.plans[id].status !== 'ready' || postsOf(id).some(p => !p.hasContent)){ toast('Picking up this month\'s plan where it stopped'); runPlan(id); } else toast('This month already has a plan'); return; }
    const reuse = $('#npl-reuse')?.checked ? plansOf(ui.brandId)[0]?.[1] : null;
    const b0 = D.brands[ui.brandId]; const mix = {}; let bad = '';
    FORMATS.forEach(f => { const n = Math.max(0, Math.min(40, parseInt($('#mx-' + f)?.value || '0', 10) || 0)); const ch = FMT_CH[f].filter(c => $(`#mxc-${f}-${c}`)?.checked); mix[f] = {n, ch, products:msVals('msp-' + f), pillars:msVals('msl-' + f)}; if (n > 0 && !ch.length) bad = f; });
    const pls = arr(b0.pillars).map((x, i) => ({...x, i})).filter(x => $('#pp-' + x.i)?.checked).map(x => ({name:x.name, purpose:x.purpose || '', mix:Math.max(0, parseInt($('#ppm-' + x.i)?.value || '0', 10) || 0)}));
    const psum = pls.reduce((s, x) => s + x.mix, 0);
    if (pls.length && !psum){ pls.forEach(x => x.mix = Math.round(100 / pls.length)); }
    else if (pls.length && psum !== 100){ pls.forEach(x => x.mix = Math.round(x.mix / psum * 100)); }
    const hero = arr(b0.brain?.products).map((x, i) => ({...x, i})).filter(x => $('#hp-' + x.i)?.checked).map(x => ({name:x.name, note:($('#hpn-' + x.i)?.value || '').trim()}));
    const mode = document.querySelector('input[name="npl-mode"]:checked')?.value || 'mix';
    let schedule = null;
    if (mode === 'schedule'){
      schedule = readSched(); const c = schedCounts(schedule, month);
      if (!c.month){ toast('Add at least one post to the weekly schedule'); return; }
      if (c.month > 90){ toast('That schedule makes more than 90 posts this month. Trim it a little.'); return; }
      FORMATS.forEach(f => { mix[f] = {n:c.byF[f] || 0, ch:[...new Set(WK.flatMap(d => arr(schedule[d]).filter(x => x.format === f).map(x => x.channel)))], products:[], pillars:[]}; });
      bad = '';
    }

    if (!mixTotal(mix)){ toast('Set how many posts you want'); return; }
    if (mode === 'mix' && mixTotal(mix) > 60){ toast('Keep it to 60 posts or fewer per month'); return; }
    patch('brands', ui.brandId, mode === 'schedule' ? {scheduleDefault:schedule, planMode:'schedule', lastHero:hero} : {mixDefault:mix, planMode:'mix', lastHero:hero});
    if (pls.length) patch('brands', ui.brandId, {pillars:arr(b0.pillars).map((x, i) => { const s2 = pls.find(y => y.name === x.name); return s2 ? {...x, mix:s2.mix} : x; })});
    const o = {mode, schedule, mix, pillars:pls, hero, cd:$('#npl-cd').checked, region:$('#npl-region').value, lang:$('#npl-lang').value, brief:($('#npl-brief')?.value || '').trim(), topical:$('#npl-top').checked, reels:$('#npl-reels').checked, paid:$('#npl-paid').checked, inf:$('#npl-inf').checked};
    const doc = {brandId:ui.brandId, month, opts:o, status:'generating', createdAt:Date.now(), createdBy:me};
    if (reuse){ doc.snapshot = reuse.snapshot; doc.research = reuse.research; }
    await put('plans', id, doc);
    ui.view = 'plan'; ui.planId = id; ui.tab = 'deck'; renderAll(); window.scrollTo(0,0);
    runPlan(id);

/* ---------- website product import ---------- */
async function importSite(bid, auto){
  const b = D.brands[bid]; const url = str(b?.website).trim();
  if (!url){ toast('Add the brand website in Profile & team first'); return; }
  if (!HOSTED){ toast('Website import works on the Vercel version of the planner'); return; }
  if (ui.importBusy) return;
  ui.importBusy = true; renderAll(); toast('Reading ' + url.replace(/^https?:\/\//, '') + ' for products…');
  try {
    const r = await fetch('/api/scrape', {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'}, body:JSON.stringify({url})});
    if (r.status === 401){ showLogin(); return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw {message:j.error || 'Could not read the website'};
    let prods = arr(j.products), desc = '', offerings = '';
    if (!prods.length && (j.text || arr(j.jsonld).length)){
      toast('Found the site. Picking out products with AI…');
      const x = await ai(`You are reading a brand's website to build its product and service catalogue for a social media team.

WEBSITE: ${url}
TITLE: ${j.title || ''}
META DESCRIPTION: ${j.description || ''}
STRUCTURED PRODUCT DATA: ${JSON.stringify(arr(j.jsonld)).slice(0, 6000)}
PAGE TEXT:
${str(j.text).slice(0, 22000)}

TASK: List every distinct product, product range or service this brand sells, using only what is on these pages. Do not invent prices or offers; leave them empty if not shown. Also write a one-line description of the brand and a one-sentence summary of what it offers.

Reply with only JSON: {"description":"","offerings":"","products":[{"name":"","what":"what it is / category","benefits":"key benefits or features from the site","price":"as shown or empty","offer":"any offer shown or empty"}]}`);
      prods = arr(x?.products); desc = str(x?.description); offerings = str(x?.offerings);
    }
    if (!prods.length){ toast('No products found on that site. Add them by hand or paste the catalogue.'); return; }
    const cur = D.brands[bid];
    const have = new Set(arr(cur.brain?.products).map(p => str(p.name).toLowerCase().trim()));
    const add = [];
    for (const p of prods){
      const n = str(p.name).trim().slice(0, 120); if (!n || have.has(n.toLowerCase())) continue; have.add(n.toLowerCase());
      add.push({name:n, what:str(p.what).slice(0, 160), benefits:str(p.benefits).slice(0, 240), price:str(p.price).slice(0, 40), offer:str(p.offer).slice(0, 120), url:linkOK(p.url) ? p.url : '', source:'website'});
      if (add.length >= 300) break;
    }
    const part = {brain:{products:arr(cur.brain?.products).concat(add)}};
    if (!str(cur.desc).trim() && (desc || j.description)) part.desc = desc || j.description;
    if (!str(cur.offerings).trim() && offerings) part.offerings = offerings;
    await patch('brands', bid, part);
    toast(add.length ? `Imported ${add.length} products from the ${j.source}` : 'Products already up to date');
  } catch (e){
    toast(e?.code ? errCopy(e) : ('Import failed: ' + (e?.message || 'try again')));
  } finally { ui.importBusy = false; renderAll(); }
}

/* ---------- hosted (Vercel) adapters ---------- */
function showLogin(msg){ const lg = $('#lg-logo'); if (lg && !lg.innerHTML) lg.innerHTML = LOGO_IMG; const l = $('#login'); l.hidden = false; const e = $('#lg-err'); e.hidden = !msg; e.textContent = msg || ''; setTimeout(() => $('#lg-pw')?.focus(), 30); }
function parseLoose(t){
  const s = String(t || '').trim();
  try { return JSON.parse(s); } catch (e) {}
  const f = s.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try { return JSON.parse(f[1]); } catch (e) {} }
  const i = s.search(/[\[{]/), j = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (i >= 0 && j > i){ try { return JSON.parse(s.slice(i, j + 1)); } catch (e) {} }
  return undefined;
}
function httpDB(){
  const subs = {}, last = {}; let ver = null, pending = 0, timer = null, warned = false;
  async function sync(force){
    if (pending && !force) return;
    let r;
    try { r = await fetch('/api/sync' + (ver != null && !force ? '?v=' + encodeURIComponent(ver) : ''), {credentials:'same-origin', cache:'no-store'}); }
    catch (e){ if (!warned){ toast('Offline. Changes will sync when you reconnect.'); warned = true; } return; }
    if (r.status === 401){ showLogin(); return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ if (!warned){ toast(j.error || 'Could not load data'); warned = true; } return; }
    warned = false; $('#login').hidden = true;
    if (j.same) return;
    ver = j.v;
    for (const col in subs){
      const m = j.data?.[col] || {}; const k = JSON.stringify(m);
      if (last[col] === k) continue; last[col] = k;
      const snap = {docs:Object.entries(m).map(([id, v]) => ({id, exists:true, data:() => v}))};
      subs[col].forEach(cb => cb(snap));
    }
  }
  function start(){ if (timer) return; setTimeout(() => sync(true), 0); timer = setInterval(() => { if (!document.hidden) sync(); }, 30000); document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); }); }
  async function write(body){
    pending++;
    try {
      const r = await fetch('/api/db', {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
      if (r.status === 401){ showLogin(); throw {code:'invalid_argument'}; }
      if (!r.ok){ const j = await r.json().catch(() => ({})); throw {code:'unavailable', message:j.error}; }
      const j = await r.json().catch(() => ({})); if (j.v != null) ver = j.v;
    } finally { pending--; }
  }
  return {
    refresh: () => sync(true),
    collection: col => ({ limit: () => ({ onSnapshot: cb => { (subs[col] = subs[col] || []).push(cb); start(); return () => {}; } }) }),
    doc: path => { const [col, id] = path.split('/'); return { set: d => write({op:'set', col, id, data:d}), update: d => write({op:'update', col, id, data:d}), delete: () => write({op:'delete', col, id}) }; }
  };
}
async function hostedCall(prompt, o={}){
  let r;
  try { r = await fetch('/api/ai', {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'}, body:JSON.stringify({prompt, tier:o.modelTier || 'default', json:!!o.json, search:!!o.search}), signal:o.signal}); }
  catch (e){ if (e?.name === 'AbortError') throw {code:'cancelled'}; throw {code:'upstream_error', message:'Network error'}; }
  if (r.status === 401){ showLogin(); throw {code:'not_granted', message:'Sign in again'}; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw {code:j.code || 'upstream_error', message:j.error || ('AI error ' + r.status)};
  return o.raw ? j : String(j.text || '');
}
async function webJSON(prompt, signal){
  if (HOSTED){
    const j = await hostedCall(prompt, {search:true, raw:true, signal});
    const v = parseLoose(j.text); if (v === undefined) throw {code:'invalid_json', text:j.text};
    return {data:v, sources:arr(j.sources).slice(0, 30), searched:!j.searchDropped};
  }
  return {data:await ai(prompt, {signal}), sources:[]};
}
const hostedAI = async (prompt, o={}) => { const text = await hostedCall(prompt, o); if (!text.trim()) throw {code:'empty_completion'}; return {text, truncated:false}; };
hostedAI.json = async (prompt, o={}) => { const t = await hostedCall(prompt, {...o, json:true}); const v = parseLoose(t); if (v === undefined) throw {code:'invalid_json', text:t}; return v; };
const hostedDL = { save: async ({filename, data}) => { const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return {status:'saved'}; } };
let hostedDB = null;
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();

    const r = await fetch('/api/login', {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'}, body:JSON.stringify({password:pw})});
