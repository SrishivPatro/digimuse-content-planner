<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Digimuse Content Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
html{color-scheme:light}
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F7F9; --ink:#0A0A0B; --ink-2:#3A3D46; --muted:#7A7E8A;
  --line:#E8E8EA; --line-2:#D4D6DC;
  --side:#FFFFFF; --side-2:#F2F3F6; --side-ink:#0A0A0B; --side-muted:#6B6F7A;
  --accent:#0F2350; --accent-ink:#FFFFFF; --accent-soft:#EEF1F7;
  --c1:#0F2350; --c2:#0A0A0B; --c3:#34466E; --c4:#8C96AB; --c5:#1C3A7A; --c6:#5B6B8C;
  --c1s:#F4F5F8; --c2s:#F4F5F8; --c3s:#F4F5F8; --c4s:#F1F3F8; --c5s:#F4F5F8; --c6s:#F4F5F8;
  --s-idea:#8A8F9C; --s-copy:#2B4C8C; --s-design:#5A4A8A; --s-client:#94681E; --s-changes:#A23B3B; --s-approved:#2F6B4F; --s-live:#2D5F6B;
  --warn:#A23B3B; --bar:#0F2350;
  --shadow:0 1px 2px rgba(10,10,11,.04),0 12px 32px rgba(10,10,11,.06);
  --fd:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.015em;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:30px;line-height:1.1;font-weight:800}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--fm);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12.5px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:4px}
.spectrum{display:flex;height:5px;border-radius:99px;overflow:hidden}
.spectrum i{flex:1}
.spectrum i:nth-child(1){background:#FFFFFF} .spectrum i:nth-child(2){background:var(--c4)} .spectrum i:nth-child(3){background:var(--c3)} .spectrum i:nth-child(4){background:var(--c1)} .spectrum i:nth-child(5){background:var(--c5)} .spectrum i:nth-child(6){background:var(--c6)}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:20px}
.logo{display:flex;flex-direction:column;gap:10px;padding:0 6px}
.logo .wm{font-family:var(--fd);font-weight:800;font-size:25px;letter-spacing:-.03em;line-height:1}
.logo .wm span{color:var(--c3)}
.logo small{color:var(--side-muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.bitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--side-muted);font-weight:600}
.nav button:hover,.bitem:hover{background:var(--side-2);color:var(--side-ink)}
.nav button.on,.bitem.on{background:var(--side-2);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--c3)}
.nav .ico{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.nav .count{margin-left:auto;font-family:var(--fm);font-size:11px;background:var(--c1);color:#fff;border-radius:99px;padding:0 7px;font-weight:600}
.slabel{display:flex;justify-content:space-between;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);font-weight:700;padding:0 10px 6px}
.lnk{background:none;border:0;color:var(--c3);cursor:pointer;font-weight:700;font-size:12px;padding:2px 4px;text-transform:none;letter-spacing:0}
.blist{display:flex;flex-direction:column;gap:1px}
.bav{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:11px;flex:none;color:#fff}
.me{margin-top:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--side-2);border-radius:12px}
.me label{font-size:11px;color:var(--side-muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em}
.me select{background:var(--side);color:var(--side-ink);border-color:var(--side-2)}
.mode{font-size:12px;color:var(--side-muted);padding:8px 10px;border:1px dashed var(--side-2);border-radius:9px;margin:0 4px}
main{padding:28px 32px 90px;min-width:0}
.wrap{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* headers */
.hero{position:relative;border-radius:18px;padding:24px 26px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end}
.hero::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--c2),var(--c5),var(--c1),var(--c6),var(--c4))}
.hero.brand::before{background:var(--bc,var(--c1));height:100%;width:8px;inset:0 auto 0 0}
.hero .blob{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--bc,var(--c1));opacity:.09;pointer-events:none}
.hero > div{position:relative}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.crumb button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:600}
.crumb button:hover{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font-weight:500}
label.chip{cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;color:#fff;background:var(--chc,#555);white-space:nowrap}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.hot{background:var(--c2);border-color:var(--c2);color:#fff}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn .spark{opacity:.85}
.in{font-weight:400;width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
textarea.in{resize:vertical;line-height:1.5}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2);min-width:0}
label.f .hint{font-weight:400;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.fg .span2{grid-column:span 2}
@media (max-width:560px){.fg .span2{grid-column:auto}}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel > header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel > header p{color:var(--muted);font-size:13px;margin-top:2px}
.panel h2 .dotc{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:1px;background:var(--dc,var(--c1))}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{border-radius:16px;padding:16px 18px;background:var(--sb,var(--c1s));border:1px solid color-mix(in srgb,var(--sc,var(--c1)) 20%,transparent);display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--fd);font-size:34px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.stat i{width:28px;height:6px;border-radius:99px;background:var(--sc,var(--c1));margin-bottom:6px}
.stat.warn b{color:var(--warn)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:700;color:var(--ink-2);background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td,th{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.tw td .in{padding:5px 8px;font-size:13px}

.pill{--c:var(--s-idea);display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.flag{font-size:11.5px;color:var(--warn);font-weight:700}
.bar{display:flex;gap:2px;height:9px;border-radius:99px;overflow:hidden;background:var(--surface-2);min-width:130px}
.bar i{display:block;height:100%}
.meter{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--c5),var(--c1),var(--c6))}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:fit-content;max-width:100%}
.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-radius:9px;white-space:nowrap;font-size:13px}
.tabs button:hover{color:var(--ink);background:var(--surface-2)}
.tabs button.on{color:var(--accent-ink);background:var(--accent)}
.tabs .n{font-family:var(--fm);font-size:11px;opacity:.75;margin-left:4px}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:14px 16px}
.banner.run{border-color:var(--accent);background:var(--accent-soft)}
.banner.err{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.banner .grow{flex:1;min-width:220px;display:flex;flex-direction:column;gap:7px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* deck */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{width:auto}
.deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;display:flex;flex-direction:column;cursor:pointer;text-align:left;min-width:0;overflow:hidden;transition:transform .15s,box-shadow .15s}
.post:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.post{transition:none}.post:hover{transform:none}}
.post .pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pmeta{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.post .cap{color:var(--ink-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.pfoot{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:auto;flex-wrap:wrap;align-items:center}
.pil{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.pil::before{content:'';width:8px;height:8px;border-radius:3px;background:var(--pc,var(--c1))}
.unwritten .cv{opacity:.55}

/* creative preview */
.cv{--cbg:var(--c1);--cfg:#fff;--cac:var(--c4);background:var(--cbg);color:var(--cfg);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:16px}
.cv.band{min-height:160px;padding-top:38px}
.cv .deco{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--cac);opacity:.9}
.cv .deco2{position:absolute;right:40px;top:26px;width:34px;height:34px;border-radius:9px;border:3px solid var(--cfg);opacity:.35;transform:rotate(18deg)}
.cv .hl{font-family:var(--fd);font-weight:800;font-size:21px;line-height:1.05;letter-spacing:-.02em;position:relative;max-width:88%;text-wrap:balance}
.cv .sl{font-size:12px;opacity:.88;position:relative;max-width:90%}
.cv .ct{align-self:flex-start;background:var(--cac);color:var(--cbg);font-weight:800;font-size:11.5px;border-radius:99px;padding:3px 11px;position:relative}
.cv .fm{position:absolute;left:14px;top:12px;font-family:var(--fm);font-size:10.5px;opacity:.8;letter-spacing:.04em}
.phone{width:min(360px,100%);border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.phone .ph-h{display:flex;align-items:center;gap:9px;padding:10px 12px;font-weight:700;font-size:13px}
.phone .ph-h small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.phone .cv{aspect-ratio:4/5;padding:40px 24px 24px}
.phone .cv.tall{aspect-ratio:9/14}
.phone .cv.wide{aspect-ratio:16/9;padding:16px}
.phone .cv .hl{font-size:28px}
.phone .ph-c{padding:10px 12px 14px;font-size:13px;white-space:pre-wrap;display:flex;flex-direction:column;gap:6px}
.phone .ph-c .tags{color:var(--accent);font-size:12.5px}
.phone .ph-a{display:flex;gap:14px;padding:8px 12px 0;font-size:16px;color:var(--ink-2)}

/* calendar */
.calw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));min-width:900px}
.cal .hd{padding:9px 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);background:var(--surface-2)}
.cell{min-height:124px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;display:flex;flex-direction:column;gap:4px}
.cell:nth-child(7n+7){border-right:0}
.cell.off{background:var(--surface-2)}
.cell.we{background:color-mix(in srgb,var(--c4) 5%,var(--surface))}
.cell.today .dn span{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 6px}
.dn{font-family:var(--fm);font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;font-weight:500}
.dn button{visibility:hidden;background:var(--accent-soft);border:0;cursor:pointer;color:var(--accent);font-weight:800;font-size:14px;line-height:1;padding:2px 6px;border-radius:6px}
.cell:hover .dn button,.dn button:focus-visible{visibility:visible}
.tday{font-size:11px;font-weight:700;line-height:1.25;color:var(--ink);background:var(--c4s);border-radius:5px;padding:2px 6px}
.pc{--c:var(--s-idea);display:flex;gap:6px;width:100%;text-align:left;border:0;background:color-mix(in srgb,var(--chc,#666) 10%,var(--surface));border-radius:7px;padding:4px 6px;font-size:11.5px;line-height:1.3;cursor:grab;color:var(--ink);box-shadow:inset 3px 0 0 var(--chc,#666)}
.pc:hover{background:color-mix(in srgb,var(--chc,#666) 18%,var(--surface))}
.pc b{font-family:var(--fm);font-size:10px;font-weight:600;color:var(--ink-2);flex:none}
.pc i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;margin-top:4px;margin-left:auto}
.drop-on{background:var(--accent-soft)!important;outline:2px dashed var(--accent);outline-offset:-2px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;border-top:4px solid var(--c)}
.col > header{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;padding:2px 2px 4px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:grab;text-align:left}
.kc:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kc b{font-size:13px;line-height:1.3}
.kc .row{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center}

/* drawer */
#drawer{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end}
#drawer .scrim{position:absolute;inset:0;background:rgba(15,8,32,.45)}
.dw{position:relative;width:min(1000px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.dw-h{padding:calc(14px + env(safe-area-inset-top,0px)) 22px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;position:relative}
.dw-h::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--chc,var(--c1))}
.dw-h .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dw-b{flex:1;overflow:auto;padding:18px 22px calc(40px + env(safe-area-inset-bottom,0px))}
.dw-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.dw-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.dw-side{position:sticky;top:0;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.dw-grid{grid-template-columns:1fr}.dw-side{position:static;order:-1;align-items:center}}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;gap:11px}
.sec > h3{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec > h3 small{font-family:var(--fb);font-weight:500;font-size:12px;color:var(--muted)}
.sec.ai{background:linear-gradient(135deg,var(--c1s),var(--c2s));border-color:color-mix(in srgb,var(--c1) 25%,transparent)}
.hooks{display:flex;flex-direction:column;gap:5px}

/* ---------- plan ---------- */
function vPlan(){
  const plan = D.plans[ui.planId];
  if (!plan) return `<div class="empty"><p>This plan was removed.</p><button class="btn" data-act="go" data-v="home">Back to dashboard</button></div>`;
  const b = D.brands[plan.brandId] || {name:'Brand'};
  const ps = postsOf(ui.planId);
  const c = brandColors(b);
  const rvN = ps.filter(p => p.status === 'Sent to client').length;
  const tabs = [['deck','Content deck'],['calendar','Calendar'],['board','Board'],['review','Client review',rvN],['report','Performance'],['strategy','Strategy'],['research','Research'],['topical','Topical days'],['export','Export']];
  let body = '';
  switch (ui.tab){
    case 'calendar': body = vCal(plan, ps); break;
    case 'board': body = vBoard(ps); break;
    case 'review': body = vReview(plan, ps); break;
    case 'report': body = vReport(plan, ps); break;
    case 'strategy': body = vStrategy(plan); break;
    case 'research': body = vResearch(plan); break;
    case 'topical': body = vTopical(plan); break;
    case 'export': body = vExport(plan, ps); break;
    default: body = vDeck(plan, ps);
  }
  return `<section class="hero brand" style="--bc:${c.solid || 'var(--c1)'}"><span class="blob" aria-hidden="true"></span><div><div class="crumb"><button data-act="go" data-v="home">Dashboard</button>›<button data-act="goBrand" data-id="${plan.brandId}">${esc(b.name)}</button>›<span>Plan</span></div><h1>${esc(mLabel(plan.month))}${plan.strategy?.theme?.name ? ` · <em style="color:var(--accent)">${esc(plan.strategy.theme.name)}</em>` : ''}</h1>
    <div class="chips"><span class="chip"><b>${esc(b.name)}</b></span><span class="chip">${ps.length} posts</span><span class="chip">${esc(plan.opts?.region || '')}</span><span class="chip">${esc(plan.opts?.lang || '')}</span></div></div>
    <div class="acts" style="flex-direction:column;align-items:flex-end">${ps.length ? progressBar(ps) : ''}<button class="btn pri" data-act="addPost">+ Add post</button></div></section>
  ${banner(plan, ps)}
  <div class="tabs" role="tablist">${tabs.map(([k,l,n]) => `<button role="tab" class="${ui.tab===k?'on':''}" data-act="tab" data-k="${k}">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>
  ${body}`;
}
function banner(plan, ps){
  const g = gen[ui.planId];
  if (g?.running) return `<div class="banner run"><span class="spin" aria-hidden="true"></span><div class="grow"><b>${esc(g.label)}</b>${g.total ? `<div class="meter"><i style="width:${Math.round(g.done/g.total*100)}%"></i></div>` : ''}</div><button class="btn sm" data-act="stopGen">Stop</button></div>`;
  const unwritten = ps.filter(p => !p.hasContent).length;
  if (plan.status !== 'ready'){
    const msg = plan.error ? esc(plan.error) : plan.status === 'generating' ? 'Generation was interrupted, or is running in a teammate’s browser.' : 'This plan is not finished yet.';
    return `<div class="banner err"><div class="grow"><b>${msg}</b><span class="muted sm">Continue picks up from the last finished step.</span></div><button class="btn pri sm" data-act="runPlan" ${aiOff() ? 'disabled' : ''}>Continue</button></div>`;
  }
  if (unwritten) return `<div class="banner"><div class="grow"><b>${unwritten} post${unwritten > 1 ? 's' : ''} not written yet</b></div><button class="btn sm pri" data-act="runPlan" ${aiOff() ? 'disabled' : ''}><span class="spark">✦</span> Write them</button></div>`;
  return '';
}
function vDeck(plan, ps){
  const f = ui.f;
  const pillars = [...new Set(ps.map(p => p.pillar).filter(Boolean))];
  const chs = [...new Set(ps.map(p => p.channel).filter(Boolean))];
  const list = ps.filter(p => (!f.ch || p.channel === f.ch) && (!f.st || p.status === f.st) && (!f.pi || p.pillar === f.pi));
  if (!ps.length) return `<div class="empty"><p>No posts yet. ${gen[ui.planId]?.running ? 'The calendar is being planned.' : 'Continue the plan or add a post.'}</p></div>`;
  return `<div class="filters"><select class="in" data-chg="fch" aria-label="Channel">${opts(chs, f.ch, 'All channels')}</select><select class="in" data-chg="fst" aria-label="Status">${opts(STAT, f.st, 'All statuses')}</select><select class="in" data-chg="fpi" aria-label="Pillar">${opts(pillars, f.pi, 'All pillars')}</select><span class="muted sm">${list.length} of ${ps.length}</span></div>
  <div class="deck">${list.map(p => { const fl = flags(p); return `<button class="post ${p.hasContent ? '' : 'unwritten'}" data-act="open" data-id="${p.id}">
    ${creative(p)}
    <div class="pb"><div class="pmeta"><span class="mono">${fmtD(p.date)}${p.time ? ' · ' + esc(p.time) : ''}</span>${stPill(p.status)}</div>
    <div class="pmeta" style="justify-content:flex-start">${chBadge(p.channel)}<span class="chip">${esc(p.format)}</span>${p.topical ? `<span class="tday">${esc(p.topical)}</span>` : ''}</div>
    <b style="font-size:14px;line-height:1.3">${esc(p.topic || 'Untitled post')}</b>
    <p class="cap">${p.hasContent ? esc(p.caption) : busy[p.id] ? 'Writing…' : 'Not written yet'}</p>
    <div class="pfoot"><span class="pil" style="--pc:${pillarColor(plan, p.pillar)}">${esc(p.pillar || 'No pillar')}</span><span>${fl.length ? `<span class="flag">${fl.length} check${fl.length > 1 ? 's' : ''}</span>` : ''}${p.round ? ` · R${p.round}` : ''}${owner(p) ? ' · ' + esc(mName(owner(p))) : ''}</span></div></div></button>`; }).join('')}</div>`;
}
function vCal(plan, ps){
  const days = monthDays(plan.month);
  const first = pdate(days[0]).getDay();
  const lead = (first + 6) % 7;
  const tmap = {}; arr(plan.topical).filter(t => t.include).forEach(t => { (tmap[t.date] = tmap[t.date] || []).push(t.occasion); });
  const pmap = {}; ps.forEach(p => { (pmap[p.date] = pmap[p.date] || []).push(p); });
  const td = today();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += `<div class="cell off"></div>`;
  days.forEach(d => { const dw = pdate(d).getDay(); cells += `<div class="cell ${d === td ? 'today' : ''} ${dw === 0 || dw === 6 ? 'we' : ''}" data-drop-date="${d}"><div class="dn"><span>${pdate(d).getDate()}</span><button data-act="addPost" data-date="${d}" aria-label="Add post on ${d}" title="Add post">+</button></div>${(tmap[d] || []).map(t => `<div class="tday">${esc(t)}</div>`).join('')}${(pmap[d] || []).map(p => `<button class="pc" draggable="true" data-drag="${p.id}" data-act="open" data-id="${p.id}" style="--chc:${CHC[p.channel] || '#666'};--c:var(${STC[p.status]})" data-tip="${esc(p.status)} · ${esc(p.channel)} ${esc(p.format)}"><b>${CHA[p.channel] || esc(p.channel)}</b><span>${esc(p.topic || 'Untitled')}</span><i aria-hidden="true"></i></button>`).join('')}</div>`; });
  const tail = (7 - (lead + days.length) % 7) % 7;
  for (let i = 0; i < tail; i++) cells += `<div class="cell off"></div>`;
  const rows = ps.map(p => [`<span class="mono">${fmtD(p.date)}</span>`, esc(p.time), chBadge(p.channel), esc(p.format), `<span class="pil" style="--pc:${pillarColor(plan, p.pillar)}">${esc(p.pillar)}</span>`, `<b>${esc(p.topic)}</b>`, esc(p.hook), esc(p.topical), stPill(p.status)]);
  return `<p class="muted sm">Drag a post to another day to reschedule it. Due dates move with it. The dot on each post shows its status.</p>
  <div class="calw"><div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="hd">${d}</div>`).join('')}${cells}</div></div>
  <section class="panel"><header><h2><span class="dotc" style="--dc:var(--c6)"></span>Calendar table</h2><button class="btn sm" data-act="copyCal">Copy for Google Sheets</button></header>${tbl(['Date','Time','Channel','Format','Pillar','Topic','Hook','Topical day','Status'], rows)}</section>`;
}
function vBoard(ps){

  <div class="board">${STAT.map(s => { const items = ps.filter(p => p.status === s); return `<div class="col" data-drop-status="${esc(s)}" style="--c:var(${STC[s]})"><header>${stPill(s)}<span class="mono">${items.length}</span></header>${items.map(p => { const d = curDue(p); return `<button class="kc" draggable="true" data-drag="${p.id}" data-act="open" data-id="${p.id}"><span class="row">${chBadge(p.channel)}<span>${esc(p.format)} · ${shortD(p.date)}</span></span><b>${esc(p.topic || 'Untitled post')}</b><span class="row"><span>${esc(mName(owner(p)) || 'Unassigned')}</span><span class="${isLate(p) ? 'late' : ''}">${d ? 'due ' + shortD(d) : ''}${p.round ? ' · R' + p.round : ''}</span></span></button>`; }).join('')}</div>`; }).join('')}</div>`;

function hbars(rows, fmt){
  const max = Math.max(...rows.map(r => r.v), 0) || 1;
  const topV = Math.max(...rows.map(r => r.v));
  return `<div class="hbars">${rows.map(r => `<div class="hb ${r.v === topV ? 'top' : ''}" data-tip="${esc(r.tip || r.l)}"><span class="lb">${esc(r.l)}</span><span class="tr"><i style="width:${Math.max(0.5, r.v / max * 100)}%"></i></span><span class="v">${fmt(r.v)}</span></div>`).join('')}</div>`;
}
function vReport(plan, ps){
  const live = ps.filter(p => ['Published','Scheduled','Approved'].includes(p.status) || hasMetrics(p));
  const withM = ps.filter(hasMetrics);
  const sum = k => withM.reduce((s,p) => s + num(p.metrics?.[k]), 0);
  const reach = sum('reach'), eng = sum('likes') + sum('comments') + sum('saves') + sum('shares');
  const avgEr = reach ? eng / reach * 100 : 0;
  const ranked = withM.filter(p => er(p) != null).sort((a,b) => er(b) - er(a));
  const byPillar = {}; withM.forEach(p => { const e = er(p); if (e == null) return; const k = p.pillar || 'No pillar'; (byPillar[k] = byPillar[k] || []).push(e); });
  const pRows = Object.entries(byPillar).map(([l,v]) => ({l, v:v.reduce((s,x)=>s+x,0)/v.length, tip:`${l}: ${v.length} posts`})).sort((a,b) => b.v - a.v);
  const byFmt = {}; withM.forEach(p => { const e = er(p); if (e == null) return; (byFmt[p.format] = byFmt[p.format] || []).push(e); });
  const fRows = Object.entries(byFmt).map(([l,v]) => ({l, v:v.reduce((s,x)=>s+x,0)/v.length, tip:`${l}: ${v.length} posts`})).sort((a,b) => b.v - a.v);
  const pct = v => v.toFixed(1) + '%';
  const entry = `<section class="panel"><header><div><h2><span class="dotc" style="--dc:var(--c5)"></span>Log results</h2><p>Enter each post's numbers from Instagram or LinkedIn insights. Engagement rate = (likes + comments + saves + shares) ÷ reach.</p></div></header>
    ${live.length ? `<div class="tw"><table style="min-width:900px"><thead><tr><th>Post</th>${METRICS.map(([,l]) => `<th>${l}</th>`).join('')}<th>ER</th></tr></thead><tbody>${live.map(p => `<tr><td style="min-width:200px"><b>${esc(p.topic || 'Untitled')}</b><div class="muted sm">${shortD(p.date)} · ${esc(p.channel)} ${esc(p.format)}</div></td>${METRICS.map(([k]) => `<td style="min-width:86px"><input class="in" type="number" min="0" data-mf="${k}" data-id="${p.id}" id="m-${p.id}-${k}" value="${esc(p.metrics?.[k] ?? '')}" aria-label="${k}"></td>`).join('')}<td class="num">${er(p) != null ? pct(er(p)) : '—'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Posts appear here once they are approved, scheduled or published.</p>'}
  </section>`;
  if (!withM.length) return entry;
  return `<div class="stats">
    <div class="stat" style="--sb:var(--c1s);--sc:var(--c1)"><i></i><b>${fmtN(reach)}</b><span>Total reach · ${withM.length} posts</span></div>
    <div class="stat" style="--sb:var(--c2s);--sc:var(--c2)"><i></i><b>${fmtN(eng)}</b><span>Engagements</span></div>
    <div class="stat" style="--sb:var(--c5s);--sc:var(--c5)"><i></i><b>${pct(avgEr)}</b><span>Engagement rate</span></div>
    <div class="stat" style="--sb:var(--c3s);--sc:var(--c3)"><i></i><b>${fmtN(sum('saves'))}</b><span>Saves · ${fmtN(sum('shares'))} shares</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><header><h2>Engagement rate by post</h2></header>${hbars(ranked.slice(0,10).map(p => ({l:p.topic || 'Untitled', v:er(p), tip:`${p.topic} · reach ${fmtN(num(p.metrics.reach))}`})), pct)}</section>

/* ---------- plan pipeline ---------- */
async function pool(items, n, fn){ let i = 0; const run = async () => { while (i < items.length){ const k = i++; await fn(items[k], k); } }; await Promise.all(Array.from({length:Math.min(n, items.length)}, run)); }
function step(pid, label){ gen[pid].label = label; sched(); }
function contentPart(r, p){
  const hs = Array.isArray(r.hashtags) ? r.hashtags.join(' ') : str(r.hashtags);
  return {
    concept:str(r.concept), hooks:arr(r.hooks).map(str).slice(0,6), hook:str(r.hook) || p.hook || '',
    onImage:{headline:str(r.onImage?.headline), subline:str(r.onImage?.subline), cta:str(r.onImage?.cta)},
    slides:arr(r.slides).map((s,i) => ({n:i+1, visual:str(s.visual), copy:str(s.copy)})),
    script:arr(r.script).map(s => ({t:str(s.t), visual:str(s.visual), onscreen:str(s.onscreen), vo:str(s.vo), audio:str(s.audio)})),
    caption:str(r.caption), hashtags:hs, altText:str(r.altText),
    design:{layout:str(r.design?.layout), typography:str(r.design?.typography), palette:str(r.design?.palette), mood:str(r.design?.mood), elements:str(r.design?.elements), dos:str(r.design?.dos), donts:str(r.design?.donts), refSearch:str(r.design?.refSearch)},
    builtFrom:arr(r.builtFrom).map(str).slice(0,10), compliance:str(r.compliance), hasContent:true, writtenAt:Date.now()
  };
}
async function writePosts(posts, instr, signal){
  const b = D.brands[posts[0].brandId]; const plan = D.plans[posts[0].planId];
  const planWithId = plan ? {...plan, id:posts[0].planId} : null;
  const res = await ai(promptD(b, planWithId, posts, instr), {signal});
  const list = Array.isArray(res) ? res : arr(res?.posts);
  let n = 0;
  for (const p of posts){
    const r = list.find(x => x && x.id === p.id) || (posts.length === 1 ? list[0] : null);
    if (r){ await patch('posts', p.id, contentPart(r, p)); n++; }
  }
  if (!n) throw {code:'invalid_json', message:'no posts in reply'};
}
function newPost(b, planId, over){
  return Object.assign({brandId:D.plans[planId]?.brandId || '', planId, date:'', time:'19:00', channel:activeCh(b)[0] || 'Instagram', format:'Static', pillar:'', topic:'', hook:'', topical:'', objective:'', product:'', status:'Idea', writer:b?.team?.writer || '', designer:b?.team?.designer || '', am:b?.team?.am || '', hasContent:false, round:0, comments:[], creatives:[], checklist:{}, metrics:{}, createdAt:Date.now()}, over);
}
async function runPlan(pid){
  if (gen[pid]?.running) return;
  if (!S){ toast('AI is not available in this view'); return; }
  const ctl = new AbortController(); const signal = ctl.signal;
  gen[pid] = {running:true, label:'Starting…', done:0, total:0, ctl}; sched();
  try {
    await patch('plans', pid, {status:'generating', error:''});
    let plan = D.plans[pid]; const b = D.brands[plan.brandId];
    if (!b) throw {message:'Brand not found'};
    if (!plan.snapshot){
      step(pid, 'Researching the brand, market and competitors…');
      const r = await ai(promptA(b, plan), {signal});
      if (!r?.snapshot) throw {code:'invalid_json'};
      await patch('plans', pid, {snapshot:r.snapshot, research:r.research || {}});
    }
    plan = D.plans[pid];
    if (!plan.strategy){
      step(pid, 'Building the strategy, pillars and topical days…');
      const r = await ai(promptB(b, plan), {signal});
      if (!r?.strategy) throw {code:'invalid_json'};
      const topical = arr(r.topicalDays).filter(t => validD(t.date) && str(t.date).startsWith(plan.month)).map(t => ({date:t.date, occasion:str(t.occasion), type:str(t.type), relevance:str(t.relevance), idea:str(t.idea), sensitive:!!t.sensitive, include:!t.sensitive && t.relevance !== 'Low'}));
      await patch('plans', pid, {strategy:r.strategy, topical});
    }
    plan = D.plans[pid];
    if (!postsOf(pid).length){
      step(pid, 'Planning the content calendar…');
      const slots = await ai(promptC(b, plan), {signal});
      const list = (Array.isArray(slots) ? slots : arr(slots?.posts)).filter(s => s && validD(s.date));
      if (!list.length) throw {code:'invalid_json'};
      step(pid, `Adding ${list.length} posts to the calendar…`);
      await pool(list, 4, async s => {
        const id = uid();
        await put('posts', id, newPost(b, pid, {id, date:s.date, time:str(s.time) || '19:00', channel:CH.includes(s.channel) ? s.channel : activeCh(b)[0], format:FORMATS.includes(s.format) ? s.format : 'Static', pillar:str(s.pillar), topic:str(s.topic), hook:str(s.hook), topical:str(s.topical), objective:str(s.objective), product:str(s.product)}));
      });
    }
    const todo = postsOf(pid).filter(p => !p.hasContent);
    const batches = []; for (let i = 0; i < todo.length; i += 4) batches.push(todo.slice(i, i+4));
    gen[pid].total = todo.length; gen[pid].done = 0;
    step(pid, `Writing posts · 0 of ${todo.length} done`);
    let failed = 0;
    await pool(batches, 2, async bt => {
      if (signal.aborted) return;
      bt.forEach(p => busy[p.id] = 'Writing…'); sched();
      try { await writePosts(bt, '', signal); }
      catch (e){ if (e?.code === 'cancelled') throw e; if (['not_granted','rate_limited','session_expired','sampling_disabled'].includes(e?.code)) throw e; failed += bt.length; }
      finally { bt.forEach(p => delete busy[p.id]); }
      gen[pid].done += bt.length; step(pid, `Writing posts · ${gen[pid].done} of ${gen[pid].total} done`);
    });
    if (failed) await patch('plans', pid, {status:'paused', error:`${failed} posts could not be written. Press Continue to retry them.`});
    else { await patch('plans', pid, {status:'ready', error:'', readyAt:Date.now()}); toast('Plan ready'); }
  } catch (e){
    await patch('plans', pid, {status:'paused', error:e?.code === 'cancelled' ? 'Stopped. Press Continue to pick up where it left off.' : errCopy(e)});
  } finally {
    gen[pid].running = false; sched();
  }
}

/* ---------- AI post tools ---------- */
const TOOL = {
  punchier:'Make it punchier and more scroll-stopping: shorter sentences, stronger verbs, sharper first line.',
  shorter:'Cut the length by about 40% without losing the key message or CTA.',
  premium:'Make it sound more premium and refined: fewer emojis, confident and calm tone.',
  hinglish:'Rewrite in natural Hinglish (Hindi-English mix in Roman script), the way popular Indian creators write.',
  emoji:'Add a few well-placed, relevant emojis. Do not overdo it.',
  noemoji:'Remove every emoji and keep everything else.',
  ref:'Rewrite it to follow the structure and style of the saved Copy and Hook references in the brand brain, without copying them.',
  variants:'Write 3 distinct alternatives, each with a different angle.'
};
const FIELD_L = {'caption':'caption','hook':'opening hook','onImage.headline':'on-image headline (max 8 words)','onImage.subline':'on-image subline (max 14 words)','onImage.cta':'CTA (max 4 words)'};
async function aiTool(k){
  const p = D.posts[ui.postId]; if (!p) return;
  const field = $('#ai-field')?.value || 'caption'; lsSet('mp_aifield', field);
  const instr = k === 'custom' ? ($('#ai-custom')?.value || '').trim() : TOOL[k];
  if (!instr){ toast('Type an instruction first'); return; }
  const b = D.brands[p.brandId];
  const cur = str(getPath(p, field));
  const many = k === 'variants';
  const prompt = `${PRE}

${brandCtx(b, 7000)}

POST: ${p.channel} ${p.format} · pillar ${p.pillar} · topic: ${p.topic}
On-image: ${p.onImage?.headline} / ${p.onImage?.subline} / ${p.onImage?.cta}
Caption: ${str(p.caption).slice(0, 1500)}

TASK: Rewrite the ${FIELD_L[field]}. Instruction: ${instr}
Keep it true to the brand brain, keep the facts, respect banned words and disclaimers, and keep it fitting the ${p.channel} channel.

CURRENT ${FIELD_L[field].toUpperCase()}:
${cur || '(empty — write it fresh)'}

Reply with only JSON: ${many ? '{"options":["","",""]}' : '{"text":""}'}`;
  busy[p.id] = many ? 'Writing 3 variants…' : 'Rewriting…'; delete variants[p.id]; sched();
  try {
    const r = await ai(prompt, {tier: ['emoji','noemoji','shorter'].includes(k) ? 'quick' : 'default'});
    if (many){ const o = arr(r?.options).map(str).filter(Boolean); if (!o.length) throw {code:'invalid_json'}; variants[p.id] = {field, options:o}; }
    else { const t = str(r?.text); if (!t) throw {code:'invalid_json'}; undo[p.id] = {field, value:cur}; await setField(p.id, field, t); toast('Rewritten'); }
  } catch (e){ toast(errCopy(e)); }
  finally { delete busy[p.id]; sched(); }
}
async function setField(id, path, value){
  const p = D.posts[id]; if (!p) return;
  const c = clone(p); setPath(c, path, value);
  const top = path.split('.')[0];
  await patch('posts', id, {[top]: c[top]});
}
async function regen(){
  const p = D.posts[ui.postId]; if (!p) return;
  const instr = ($('#regen-instr')?.value || '').trim();
  busy[p.id] = 'Writing this post from the Brand Brain…'; delete variants[p.id]; sched();
  try { await writePosts([p], instr); toast('Post written'); }
  catch (e){ toast(errCopy(e)); }

async function repurpose(){

  catch (e){ toast(errCopy(e)); }

function briefText(p){
  const b = D.brands[p.brandId] || {};
  const L = [`DESIGN BRIEF — ${b.name} · ${fmtD(p.date)} · ${p.channel} ${p.format}`, `Topic: ${p.topic}`, `Size: ${sizeFor(p.channel, p.format)}`, `Design due: ${fmtD(dues(p).design)}`, '', 'ON-IMAGE COPY (final)', `Headline: ${p.onImage?.headline || ''}`, `Subline: ${p.onImage?.subline || ''}`, `CTA: ${p.onImage?.cta || ''}`];
  if (arr(p.slides).length){ L.push('', 'SLIDES'); arr(p.slides).forEach((s,i) => L.push(`${i+1}. Visual: ${s.visual}\n   Copy: ${s.copy}`)); }
  if (arr(p.script).length){ L.push('', 'SCRIPT'); arr(p.script).forEach(s => L.push(`${s.t} — ${s.visual} | On screen: ${s.onscreen} | VO: ${s.vo} | Audio: ${s.audio}`)); }
  L.push('', 'DIRECTION', `Layout: ${p.design?.layout || ''}`, `Typography: ${p.design?.typography || ''} (brand fonts: ${b.brain?.kit?.fonts || '—'})`, `Palette: ${p.design?.palette || ''} (brand colours: ${b.brain?.kit?.colors || '—'})`, `Mood: ${p.design?.mood || ''}`, `Elements: ${p.design?.elements || ''}`, `Do: ${p.design?.dos || ''}`, `Don't: ${p.design?.donts || ''}`, `Logo rule: ${b.brain?.kit?.logo || '—'}`, `Reference search: ${p.design?.refSearch || ''}`);
  arr(b.brain?.refs).filter(r => r.tag === 'Design').forEach(r => L.push(`Brand ref: ${r.url} ${r.notes ? '— ' + r.notes : ''}`));
  return L.join('\n');
}
function planMd(plan, ps){
  const b = D.brands[plan.brandId] || {}; const s = plan.strategy || {}; const sn = plan.snapshot || {};
  const row = a => '| ' + a.map(x => str(x).replace(/\|/g,'/').replace(/\n/g,' ')).join(' | ') + ' |';
  const table = (h, rows) => [row(h), row(h.map(() => '---')), ...rows.map(row)].join('\n');
  const L = [`# ${b.name} — Social media plan, ${mLabel(plan.month)}`, '', `**Theme:** ${s.theme?.name || ''} — ${s.theme?.bigIdea || ''}`, '', `**Positioning:** ${sn.positioning || ''}`, '', '## Objectives', table(['Objective','KPI','Target','Measure'], arr(s.objectives).map(o => [o.objective,o.kpi,o.target,o.measure])), '', '## Content pillars', table(['Pillar','Mix','Purpose','Framework'], arr(s.pillars).map(p => [p.name, p.mix + '%', p.purpose, p.framework])), '', '## Channel roles', table(['Channel','Role','Formats','Frequency','Best times'], arr(s.channels).map(c => [c.channel,c.role,c.formats,c.frequency,c.bestTimes]))];
  if (arr(s.theme?.series).length) L.push('', '## Recurring series', table(['Series','Cadence','Format','Description'], arr(s.theme.series).map(x => [x.name,x.cadence,x.format,x.description])));
  L.push('', '## Topical days', table(['Date','Occasion','Relevance','Idea'], arr(plan.topical).filter(t => t.include).map(t => [t.date,t.occasion,t.relevance,t.idea])));
  L.push('', '## Content calendar', table(['Date','Channel','Format','Pillar','Topic'], ps.map(p => [p.date,p.channel,p.format,p.pillar,p.topic])));
  L.push('', '## Content deck');
  ps.forEach((p,i) => {
    L.push('', `### ${i+1}. ${p.topic} — ${fmtD(p.date)}, ${p.channel} ${p.format}`, `**Pillar:** ${p.pillar} · **Hook:** ${p.hook}`, '', `**On-image:** ${p.onImage?.headline || ''} / ${p.onImage?.subline || ''} / CTA: ${p.onImage?.cta || ''}`);
    if (arr(p.slides).length) L.push('', table(['#','Visual','Copy'], arr(p.slides).map((x,j) => [j+1, x.visual, x.copy])));
    if (arr(p.script).length) L.push('', table(['Time','Visual','On screen','Voiceover','Audio'], arr(p.script).map(x => [x.t,x.visual,x.onscreen,x.vo,x.audio])));
    L.push('', '**Caption**', '', str(p.caption), '', str(p.hashtags));
    if (p.compliance) L.push('', `*${p.compliance}*`);
    L.push('', `**Design note:** ${p.design?.layout || ''} ${p.design?.mood ? '· Mood: ' + p.design.mood : ''}`);
  });
  if (plan.report?.text) L.push('', '## Performance report', '', plan.report.text);
  return L.join('\n');
}

  copyTags: () => { const h = D.plans[ui.planId]?.research?.hashtags || {}; copyText(['branded','niche','broad'].map(k => arr(h[k]).join(' ')).join(' ')); },
  delPost: () => { const id = ui.postId; ui.confirm = null; ui.postId = null; del('posts', id); toast('Post deleted'); },
  copyCaption: () => { const p = D.posts[ui.postId]; copyText([str(p.caption), str(p.compliance), str(p.hashtags)].filter(Boolean).join('\n\n')); },
  copyBrief: () => copyText(briefText(D.posts[ui.postId])),
  copyCal: () => copyText(tsv(calRows(postsOf(ui.planId)))),
  copyBriefs: () => copyText(postsOf(ui.planId).filter(p => p.format !== 'Text').map(briefText).join('\n\n────────────\n\n')),
  copyMd: () => copyText(planMd(D.plans[ui.planId], postsOf(ui.planId))),
  csv: () => save(fname(D.plans[ui.planId], 'csv'), csv(calRows(postsOf(ui.planId)))),
  md: () => save(fname(D.plans[ui.planId], 'md'), planMd(D.plans[ui.planId], postsOf(ui.planId))),
  briefs: () => save(fname(D.plans[ui.planId], 'txt').replace('.txt','-design-briefs.txt'), postsOf(ui.planId).filter(p => p.format !== 'Text').map(briefText).join('\n\n────────────\n\n')),
  xlsx: () => {
    const plan = D.plans[ui.planId]; const ps = postsOf(ui.planId);
    const wb = XLSX.utils.book_new();
    const add = (name, rows, w) => { const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = rows[0].map((_,i) => ({wch: w?.[i] || 18})); XLSX.utils.book_append_sheet(wb, ws, name); };
    add('Calendar', calRows(ps), [11,6,7,11,10,18,38,40,18,16,18,16,14,14,11,11]);
    add('Content deck', deckRows(ps), [11,11,10,18,34,40,40,30,34,16,60,30,50,60,30,30,40,14]);
    add('Design briefs', briefRowsX(ps));
    add('Results', resRows(ps));
    add('Topical days', [['Date','Occasion','Type','Relevance','Idea','Included']].concat(arr(plan.topical).map(t => [t.date, t.occasion, t.type, t.relevance, t.idea, t.include ? 'Yes' : 'No'])));
    add('Pillars', [['Pillar','Mix %','Purpose','Framework','Examples']].concat(arr(plan.strategy?.pillars).map(p => [p.name, p.mix, p.purpose, p.framework, arr(p.examples).join('; ')])));
    save(fname(plan, 'xlsx'), XLSX.write(wb, {type:'array', bookType:'xlsx'}));
  },
  addMember: () => { const n = ($('#nm-name')?.value || '').trim(); if (!n){ toast('Add a name'); return; } put('team', uid(), {name:n, role:$('#nm-role').value, createdAt:Date.now()}); toast('Member added'); },
  rmMember: a => { ui.confirm = null; del('team', a.dataset.id); if (me === a.dataset.id){ me = ''; lsSet('mp_me', ''); } }
};
const CHG = {
  me: t => { me = t.value; lsSet('mp_me', me); renderAll(); },
  fch: t => { ui.f.ch = t.value; renderAll(); },
  fst: t => { ui.f.st = t.value; renderAll(); },
  fpi: t => { ui.f.pi = t.value; renderAll(); },
  role: t => patch('team', t.dataset.id, {role:t.value}),
  ck: t => patch('posts', ui.postId, {checklist:{[t.dataset.k]:t.checked}}),
  obj: t => { const b = D.brands[ui.brandId]; let l = arr(b.objectives?.list).slice(); if (t.checked){ if (!l.includes(t.value)) l.push(t.value); } else l = l.filter(x => x !== t.value); const part = {objectives:{list:l}}; if (!l.includes(b.objectives?.primary)) part.objectives.primary = l[0] || ''; patch('brands', ui.brandId, part); },
  topInc: t => { const plan = D.plans[ui.planId]; const l = clone(arr(plan.topical)); if (l[+t.dataset.i]) l[+t.dataset.i].include = t.checked; patch('plans', ui.planId, {topical:l}); }
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(a, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.chg && CHG[t.dataset.chg]) return CHG[t.dataset.chg](t);
  if (t.dataset.mf){ const id = t.dataset.id; if (D.posts[id]) patch('posts', id, {metrics:{[t.dataset.mf]:t.value === '' ? '' : num(t.value)}}); return; }
  if (t.dataset.bf){
    let v = t.type === 'checkbox' ? t.checked : t.value;
    if (t.type === 'number' || t.type === 'range') v = Number(v);
    patch('brands', ui.brandId, setPath({}, t.dataset.bf, v));
    if (t.dataset.bf === 'name') toast('Saved');
    return;
  }
  if (t.dataset.pf && ui.postId) setField(ui.postId, t.dataset.pf, t.value);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!$('#copybox').hidden) ACT.closeCopy(); else if (ui.postId) ACT.close(); } });
document.addEventListener('dragstart', e => { const t = e.target.closest && e.target.closest('[data-drag]'); if (!t) return; e.dataTransfer.setData('text/plain', t.dataset.drag); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('[data-drop-date],[data-drop-status]'); if (!c) return; e.preventDefault(); document.querySelectorAll('.drop-on').forEach(x => x !== c && x.classList.remove('drop-on')); c.classList.add('drop-on'); });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('[data-drop-date],[data-drop-status]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('drop-on'); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('[data-drop-date],[data-drop-status]'); if (!c) return;
  e.preventDefault(); c.classList.remove('drop-on');
  const id = e.dataTransfer.getData('text/plain'); if (!D.posts[id]) return;
  if (c.dataset.dropDate){ patch('posts', id, {date:c.dataset.dropDate}); toast('Moved to ' + fmtD(c.dataset.dropDate)); }
  else setStatus(id, c.dataset.dropStatus);
});
const tip = $('#tip');
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t){ tip.hidden = true; return; } tip.textContent = t.dataset.tip; tip.hidden = false; });
document.addEventListener('mousemove', e => { if (tip.hidden) return; const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 16) + 'px'; });

/* ---------- hosted (Vercel) adapters ---------- */
function showLogin(msg){ const l = $('#login'); l.hidden = false; const e = $('#lg-err'); e.hidden = !msg; e.textContent = msg || ''; setTimeout(() => $('#lg-pw')?.focus(), 30); }
function parseLoose(t){
  const s = String(t || '').trim();
  try { return JSON.parse(s); } catch (e) {}
  const f = s.match(/```(?:json)?\s*([\s\S]*?)```/); if (f){ try { return JSON.parse(f[1]); } catch (e) {} }
  const i = s.search(/[\[{]/), j = Math.max(s.lastIndexOf('}'), s.lastIndexOf(']'));
  if (i >= 0 && j > i){ try { return JSON.parse(s.slice(i, j + 1)); } catch (e) {} }
  return undefined;
}
function httpDB(){
  const subs = {}, last = {}; let ver = null, pending = 0, timer = null, warned = false;
  async function sync(force){
    if (pending && !force) return;
    let r;
    try { r = await fetch('/api/sync' + (ver != null && !force ? '?v=' + encodeURIComponent(ver) : ''), {credentials:'same-origin', cache:'no-store'}); }
    catch (e){ if (!warned){ toast('Offline. Changes will sync when you reconnect.'); warned = true; } return; }
    if (r.status === 401){ showLogin(); return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok){ if (!warned){ toast(j.error || 'Could not load data'); warned = true; } return; }
    warned = false; $('#login').hidden = true;
    if (j.same) return;
    ver = j.v;
    for (const col in subs){
      const m = j.data?.[col] || {}; const k = JSON.stringify(m);
      if (last[col] === k) continue; last[col] = k;
      const snap = {docs:Object.entries(m).map(([id, v]) => ({id, exists:true, data:() => v}))};
      subs[col].forEach(cb => cb(snap));
    }
  }
  function start(){ if (timer) return; setTimeout(() => sync(true), 0); timer = setInterval(() => { if (!document.hidden) sync(); }, 30000); document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); }); }
  async function write(body){
    pending++;
    try {
      const r = await fetch('/api/db', {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
      if (r.status === 401){ showLogin(); throw {code:'invalid_argument'}; }
      if (!r.ok){ const j = await r.json().catch(() => ({})); throw {code:'unavailable', message:j.error}; }
      const j = await r.json().catch(() => ({})); if (j.v != null) ver = j.v;
    } finally { pending--; }
  }
  return {
    refresh: () => sync(true),
    collection: col => ({ limit: () => ({ onSnapshot: cb => { (subs[col] = subs[col] || []).push(cb); start(); return () => {}; } }) }),
    doc: path => { const [col, id] = path.split('/'); return { set: d => write({op:'set', col, id, data:d}), update: d => write({op:'update', col, id, data:d}), delete: () => write({op:'delete', col, id}) }; }
  };
}
async function hostedCall(prompt, o={}){
  let r;
  try { r = await fetch('/api/ai', {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'}, body:JSON.stringify({prompt, tier:o.modelTier || 'default', json:!!o.json}), signal:o.signal}); }
  catch (e){ if (e?.name === 'AbortError') throw {code:'cancelled'}; throw {code:'upstream_error', message:'Network error'}; }
  if (r.status === 401){ showLogin(); throw {code:'not_granted', message:'Sign in again'}; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw {code:j.code || 'upstream_error', message:j.error || ('AI error ' + r.status)};
  return String(j.text || '');
}
const hostedAI = async (prompt, o={}) => { const text = await hostedCall(prompt, o); if (!text.trim()) throw {code:'empty_completion'}; return {text, truncated:false}; };
hostedAI.json = async (prompt, o={}) => { const t = await hostedCall(prompt, {...o, json:true}); const v = parseLoose(t); if (v === undefined) throw {code:'invalid_json', text:t}; return v; };
const hostedDL = { save: async ({filename, data}) => { const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return {status:'saved'}; } };
let hostedDB = null;
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('#lg-pw').value;
  try {
    const r = await fetch('/api/login', {method:'POST', credentials:'same-origin', headers:{'content-type':'application/json'}, body:JSON.stringify({password:pw})});
    if (!r.ok){ const j = await r.json().catch(() => ({})); showLogin(j.error || 'Wrong password'); return; }
    $('#login').hidden = true; $('#lg-pw').value = ''; hostedDB?.refresh();
  } catch (err){ showLogin('Could not reach the server. Try again.'); }
});

/* ---------- boot ---------- */
renderAll();
(async () => {
  const c = window.claude;
  let db = null;
  if (c && c.use){
    const [a, sm, dl] = await Promise.all([c.use('db').catch(() => null), c.use('sample').catch(() => null), c.use('downloads').catch(() => null)]);
    db = a; S = sm; DL = dl;
  } else if (HOSTED){
    hostedDB = db = httpDB(); S = hostedAI; DL = hostedDL;
  } else return;
  if (db){
    DB = db;
    for (const col of ['brands','team','plans','posts']){
      DB.collection(col).limit(1000).onSnapshot(s => {
        const m = {}; s.docs.forEach(d => { if (d.exists) m[d.id] = Object.assign({}, d.data(), col === 'posts' ? {id:d.id} : {}); });
        D[col] = m; sched();
      }, err => { toast(err?.code === 'revoked' ? 'Access to shared data was removed' : 'Live sync paused. Reload to reconnect.'); });
    }
  }
  sched();
})();
})();
